/* ================= TIMELINE (Gantt) =================
   Weeks across the top, projects down the side. A bar runs from the
   project's start date (or its creation date) to its deadline; milestones
   are diamonds on the bar. Today is a vertical line.                    */
let tlWeeks=12, tlFrom=null;    // tlFrom = Monday of the first shown week
function tlMonday(d){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function tlDays(a,b){ return Math.round((b-a)/86400000); }
function tlShift(n){ tlFrom.setDate(tlFrom.getDate()+7*n); renderTimeline(); }
function tlToday(){ tlFrom=tlMonday(new Date()); tlFrom.setDate(tlFrom.getDate()-14); renderTimeline(); }
function tlSpan(n){ tlWeeks=n; renderTimeline(); }
function renderTimeline(){
  if(!tlFrom){ tlFrom=tlMonday(new Date()); tlFrom.setDate(tlFrom.getDate()-14); }
  const from=new Date(tlFrom), to=new Date(from); to.setDate(to.getDate()+tlWeeks*7);
  const totalDays=tlWeeks*7;
  const today=new Date(); today.setHours(0,0,0,0);
  const pct=d=>Math.max(0,Math.min(100,tlDays(from,d)/totalDays*100));

  const rows=projects.map((p,i)=>({p,i}))
    .filter(x=>(x.p.data.status||'active')!=='archived')
    .map(x=>{
      const d=x.p.data;
      const end=d.deadline?new Date(d.deadline+'T00:00:00'):null;
      let start=d.start?new Date(d.start+'T00:00:00'):(d.created?new Date(d.created):null);
      if(start)start.setHours(0,0,0,0);
      if(start&&end&&start>end)start=new Date(end);
      return {...x,start,end,ms:(d.milestones||[]).map((m,mi)=>({...m,mi,dt:new Date(m.date+'T00:00:00')}))};
    })
    .filter(x=>x.end||x.ms.length)
    .filter(x=>{ const a=x.start||x.end, b=x.end||x.start; return !(b<from||a>to) || x.ms.some(m=>m.dt>=from&&m.dt<to); })
    .sort((a,b)=>((a.start||a.end)-(b.start||b.end)));

  // week header + month header
  let months='',weeks='';
  let mStart=0, curM=from.getMonth(), curY=from.getFullYear();
  for(let w=0;w<=tlWeeks;w++){
    const d=new Date(from); d.setDate(d.getDate()+w*7);
    if(w===tlWeeks||d.getMonth()!==curM){
      const span=w-mStart;
      months+=`<div class="tl-month" style="flex:${span}">${new Date(curY,curM,1).toLocaleDateString(undefined,{month:'short',year:'2-digit'})}</div>`;
      mStart=w; curM=d.getMonth(); curY=d.getFullYear();
    }
    if(w<tlWeeks){
      const isThis=today>=d&&today<new Date(d.getFullYear(),d.getMonth(),d.getDate()+7);
      weeks+=`<div class="tl-week${isThis?' now':''}"><b>${d.getDate()}</b><span>${d.toLocaleDateString(undefined,{month:'short'})}</span></div>`;
    }
  }
  const todayPct=(today>=from&&today<to)?pct(today):null;

  const body=rows.length?rows.map(({p,i,start,end,ms})=>{
    const d=p.data, prio=(d.priority||'Medium').toLowerCase(), done=d.status==='done';
    const s=start||end, e=end||start;
    const left=pct(s), right=pct(new Date(e.getFullYear(),e.getMonth(),e.getDate()+1));
    const over=!done&&end&&end<today;
    const bar=`<div class="tl-bar p-${prio}${done?' done':''}${over?' over':''}" style="left:${left}%;width:${Math.max(0.6,right-left)}%"
        title="${esc(d.name)} · ${s.toLocaleDateString()} → ${e.toLocaleDateString()}">
        <span>${esc(d.name)}</span></div>`;
    const dia=ms.filter(m=>m.dt>=from&&m.dt<to).map(m=>
      `<div class="tl-ms${m.done?' done':''}${(!m.done&&m.dt<today)?' over':''}${(m.files||[]).length?' hasfiles':''}" style="left:${pct(m.dt)}%"
        title="${esc(m.date)} · ${esc(m.text)}${m.done?' · done':''}${(m.files||[]).length?' · '+(m.files||[]).length+' file(s)':''} — click to open"
        onclick="openMilestone(${i},${m.mi})"></div>`).join('');
    const nextMs=ms.filter(m=>!m.done&&m.dt>=today).sort((a,b)=>a.dt-b.dt)[0];
    return `<div class="tl-row">
      <div class="tl-label" onclick="selectedProjectIndex=${i};activeNav='projects';renderNav();renderProject()">
        <b>${esc(d.name)}</b>
        <small>${done?'✓ done':(end?deadlineInfo(d.deadline).label:'no deadline')}${nextMs?` · <span style="cursor:pointer;text-decoration:underline dotted" onclick="event.stopPropagation();openMilestone(${i},${nextMs.mi})">◆ ${esc(nextMs.text)} ${esc(nextMs.date)}</span>`:''}</small>
      </div>
      <div class="tl-track">${bar}${dia}${todayPct!==null?`<div class="tl-today" style="left:${todayPct}%"></div>`:''}</div>
    </div>`;}).join('')
    :'<div class="empty-note" style="margin:14px">No projects with a deadline in this period. Set a deadline (and optionally a start date and milestones) in a project\'s Edit screen.</div>';

  document.getElementById('mainView').innerHTML=`
    <div class="tilebar">
      <h2>Timeline</h2>
      <span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <button class="btn btn-out" style="padding:7px 12px" onclick="tlShift(-4)">‹‹</button>
        <button class="btn btn-out" style="padding:7px 12px" onclick="tlShift(-1)">‹</button>
        <button class="btn btn-out" style="padding:7px 12px" onclick="tlToday()">Today</button>
        <button class="btn btn-out" style="padding:7px 12px" onclick="tlShift(1)">›</button>
        <button class="btn btn-out" style="padding:7px 12px" onclick="tlShift(4)">››</button>
        <span class="modetog" style="margin:0 0 0 8px">
          ${[8,12,26,52].map(n=>`<button class="tbtn sm${tlWeeks===n?' on':''}" onclick="tlSpan(${n})">${n} wk</button>`).join('')}
        </span>
      </span>
    </div>
    <div class="pres-legend">
      <span><i style="background:#d92d20"></i> urgent</span><span><i style="background:#f79009"></i> high</span>
      <span><i style="background:#2f6df6"></i> medium</span><span><i style="background:#98a2b3"></i> low</span>
      <span><i style="background:#12b76a"></i> done</span>
      <span>◆ milestone — click it to mark done or attach files</span>
      <span><i style="background:var(--warn);width:2px"></i> today</span>
    </div>
    <div class="tl-wrap" style="--wk:${tlWeeks}">
      <div class="tl-row tl-head"><div class="tl-label"></div><div class="tl-track"><div class="tl-months">${months}</div><div class="tl-weeks">${weeks}</div></div></div>
      ${body}
    </div>`;
}

/* ================= ATTENDANCE =================
   One Google Sheet, "Attendance", in LABCORE_DATA — the same layout as the
   old shared spreadsheet: people across the top, days down the side, one
   tab per month. Blank = in, 0 = not in, "from 12"/"until 14" = partly.
   Lithuanian public holidays are filled with 0 automatically.
   The sheet can also be opened and edited directly in Drive.           */
const ATT_NAME='Attendance';
let attId=null, attMonth=(()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');})();
let attPeople=[], attCells={}, attDirty={}, attSaveTimer=null, attPollTimer=null, attLoadedRev=null, attShowPast=false;

/* ---- Lithuanian public holidays ---- */
function ltEaster(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3);
  const h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
  const mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  return new Date(y,mo-1,da);
}
function ltHolidays(y){
  const set=new Set();
  const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  [[1,1],[2,16],[3,11],[5,1],[6,24],[7,6],[8,15],[11,1],[11,2],[12,24],[12,25],[12,26]]
    .forEach(([m,d])=>set.add(key(new Date(y,m-1,d))));
  const e=ltEaster(y); set.add(key(e)); set.add(key(new Date(e.getFullYear(),e.getMonth(),e.getDate()+1)));
  return set;
}
const LT_HOLIDAY_NAMES={'01-01':'New Year','02-16':'Independence Day','03-11':'Restoration of Independence',
  '05-01':'Labour Day','06-24':'Joninės','07-06':'Statehood Day','08-15':'Žolinė','11-01':'All Saints',
  '11-02':'All Souls','12-24':'Christmas Eve','12-25':'Christmas','12-26':'Christmas'};

/* ---- the spreadsheet ---- */
async function attEnsureSheet(){
  if(attId)return attId;
  const r=await gapi.client.drive.files.list({
    q:`name='${ATT_NAME}' and '${rootFolderId}' in parents and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false`,
    fields:'files(id,modifiedTime)',pageSize:10});
  const found=(r.result.files||[]).sort((a,b)=>new Date(b.modifiedTime)-new Date(a.modifiedTime));
  if(found.length){ attId=found[0].id; return attId; }
  const c=await gapi.client.drive.files.create({
    resource:{name:ATT_NAME,mimeType:'application/vnd.google-apps.spreadsheet',parents:[rootFolderId]},fields:'id'});
  attId=c.result.id;
  // first tab = current month
  await gapi.client.sheets.spreadsheets.batchUpdate({spreadsheetId:attId,
    requests:[{updateSheetProperties:{properties:{sheetId:0,title:attMonth},fields:'title'}}]});
  await attWriteSkeleton(attMonth);
  return attId;
}
async function attTabs(){
  const r=await gapi.client.sheets.spreadsheets.get({spreadsheetId:attId,fields:'sheets(properties(sheetId,title))'});
  return (r.result.sheets||[]).map(x=>x.properties);
}
async function attEnsureTab(month){
  const tabs=await attTabs();
  if(tabs.some(t=>t.title===month))return;
  await gapi.client.sheets.spreadsheets.batchUpdate({spreadsheetId:attId,
    requests:[{addSheet:{properties:{title:month,gridProperties:{frozenRowCount:1,frozenColumnCount:1}}}}]});
  await attWriteSkeleton(month);
}
function attDaysIn(month){ const [y,m]=month.split('-').map(Number); return new Date(y,m,0).getDate(); }
/* header row + day column (+ holidays pre-filled as 0 for everyone known) */
async function attWriteSkeleton(month){
  const [y,m]=month.split('-').map(Number), n=attDaysIn(month);
  const dow=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const people=attPeopleUnion([]);
  const hol=ltHolidays(y);
  const rows=[['Day',...people]];
  for(let d=1;d<=n;d++){
    const ds=month+'-'+String(d).padStart(2,'0');
    const label=`${d} ${dow[new Date(y,m-1,d).getDay()]}`;
    rows.push([label,...people.map(()=>hol.has(ds)?'0':'')]);
  }
  await gapi.client.sheets.spreadsheets.values.update({spreadsheetId:attId,
    range:`'${month}'!A1`,valueInputOption:'RAW',resource:{values:rows}});
}
/* The "People" tab is the one roster every month uses. */
const ATT_ROSTER='People';
let attRoster=[];
async function attLoadRoster(){
  const tabs=await attTabs();
  if(!tabs.some(t=>t.title===ATT_ROSTER)){
    await gapi.client.sheets.spreadsheets.batchUpdate({spreadsheetId:attId,
      requests:[{addSheet:{properties:{title:ATT_ROSTER,index:0}}}]});
    // seed it from project people + any names already in month tabs
    const seed=new Map();
    knownPeople().forEach(n=>seed.set(n.toLowerCase(),n));
    for(const t of tabs){
      if(!/^\d{4}-\d{2}$/.test(t.title))continue;
      try{ const r=await gapi.client.sheets.spreadsheets.values.get({spreadsheetId:attId,range:`'${t.title}'!1:1`});
        ((r.result.values||[])[0]||[]).slice(1).forEach(n=>{ if(n&&n.trim())seed.set(n.trim().toLowerCase(),n.trim()); }); }catch(e){}
    }
    attRoster=[...seed.values()].sort((a,b)=>a.localeCompare(b));
    await gapi.client.sheets.spreadsheets.values.update({spreadsheetId:attId,
      range:`'${ATT_ROSTER}'!A1`,valueInputOption:'RAW',resource:{values:[['Name'],...attRoster.map(n=>[n])]}});
    return attRoster;
  }
  const r=await gapi.client.sheets.spreadsheets.values.get({spreadsheetId:attId,range:`'${ATT_ROSTER}'!A2:A200`});
  const map=new Map();
  (r.result.values||[]).forEach(row=>{ const n=(row[0]||'').trim(); if(n)map.set(n.toLowerCase(),n); });
  knownPeople().forEach(n=>{ if(!map.has(n.toLowerCase()))map.set(n.toLowerCase(),n); });
  attRoster=[...map.values()].sort((a,b)=>a.localeCompare(b));
  // keep the tab in sync with project people added since
  if((r.result.values||[]).length!==attRoster.length){
    await gapi.client.sheets.spreadsheets.values.clear({spreadsheetId:attId,range:`'${ATT_ROSTER}'!A2:A200`});
    await gapi.client.sheets.spreadsheets.values.update({spreadsheetId:attId,
      range:`'${ATT_ROSTER}'!A2`,valueInputOption:'RAW',resource:{values:attRoster.map(n=>[n])}});
  }
  return attRoster;
}
function attPeopleUnion(fromSheet){
  const map=new Map();
  attRoster.forEach(n=>map.set(n.toLowerCase(),n));
  (fromSheet||[]).forEach(n=>{ if(n&&n.trim()&&!map.has(n.trim().toLowerCase()))map.set(n.trim().toLowerCase(),n.trim()); });
  return [...map.values()].sort((a,b)=>a.localeCompare(b));
}
/* read one month tab into attPeople / attCells */
async function attLoad(month){
  await attEnsureSheet(); await attLoadRoster(); await attEnsureTab(month);
  const r=await gapi.client.sheets.spreadsheets.values.get({spreadsheetId:attId,range:`'${month}'!A1:ZZ40`});
  const vals=r.result.values||[];
  const header=vals[0]||['Day'];
  const sheetPeople=header.slice(1);
  // people on projects but not yet in the sheet get a column
  const all=attPeopleUnion(sheetPeople);
  const missing=all.filter(n=>!sheetPeople.some(p=>p.trim().toLowerCase()===n.toLowerCase()));
  if(missing.length){
    const newHeader=['Day',...sheetPeople,...missing];
    await gapi.client.sheets.spreadsheets.values.update({spreadsheetId:attId,
      range:`'${month}'!A1`,valueInputOption:'RAW',resource:{values:[newHeader]}});
    sheetPeople.push(...missing);
  }
  attPeople=sheetPeople.map(x=>x.trim()).filter(Boolean);
  attCells={};
  const [y,m]=month.split('-').map(Number), hol=ltHolidays(y);
  const fill=[];
  for(let d=1;d<=attDaysIn(month);d++){
    const row=vals[d]||[];
    const ds=month+'-'+String(d).padStart(2,'0');
    attPeople.forEach((p,ci)=>{
      let v=(row[ci+1]||'').toString();
      if(!v&&hol.has(ds)){ v='0'; fill.push({d,ci}); }     // holiday → 0 automatically
      attCells[ds+'|'+p.toLowerCase()]=v;
    });
  }
  if(fill.length){ // persist the automatic zeros so the sheet itself shows them
    const data=fill.map(({d,ci})=>({range:`'${month}'!${attCol(ci+1)}${d+1}`,values:[['0']]}));
    try{ await gapi.client.sheets.spreadsheets.values.batchUpdate({spreadsheetId:attId,
      resource:{valueInputOption:'RAW',data}}); }catch(e){}
  }
  const meta=await gapi.client.drive.files.get({fileId:attId,fields:'modifiedTime'});
  attLoadedRev=meta.result.modifiedTime;
}
function attCol(i){ let s=''; i++; while(i>0){ const r=(i-1)%26; s=String.fromCharCode(65+r)+s; i=Math.floor((i-1)/26); } return s; }
/* write only the cells that changed */
async function attFlush(){
  const keys=Object.keys(attDirty); if(!keys.length)return;
  const data=keys.map(k=>{
    const [ds,person]=k.split('|'); const d=Number(ds.slice(-2));
    const ci=attPeople.findIndex(p=>p.toLowerCase()===person);
    return {range:`'${attMonth}'!${attCol(ci+1)}${d+1}`,values:[[attDirty[k]]]};
  });
  attDirty={};
  await gapi.client.sheets.spreadsheets.values.batchUpdate({spreadsheetId:attId,
    resource:{valueInputOption:'RAW',data}});
  const meta=await gapi.client.drive.files.get({fileId:attId,fields:'modifiedTime'});
  attLoadedRev=meta.result.modifiedTime;
  setAttState('ok','Saved');
}
function attQueue(){
  setAttState('busy','Saving…'); clearTimeout(attSaveTimer);
  attSaveTimer=setTimeout(()=>attFlush().catch(e=>{setAttState('err','Save failed');toast('Could not save: '+(e.message||e),true);}),900);
}
function setAttState(kind,text){
  const el=document.getElementById('att_state'); if(!el)return;
  el.className='syncstate '+kind;
  el.innerHTML=(kind==='busy'?'<span class="loader"></span>':(kind==='err'?'⚠':'✓'))+' <span>'+esc(text)+'</span>';
}
function attMonthLabel(m){ const [y,mo]=m.split('-').map(Number); return new Date(y,mo-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'}); }
function attShift(delta){ const [y,mo]=attMonth.split('-').map(Number); const d=new Date(y,mo-1+delta,1);
  attMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); attShowPast=false; renderPresence(); }
function attKind(v){ v=String(v||'').trim(); if(!v)return 'in'; if(/^0+$/.test(v)||/^(ne|no|out|off|-)$/i.test(v))return 'out'; return 'part'; }

async function renderPresence(){

  // Start of the current week (Monday). Days before it, in the current month,
  // are folded away behind a toggle so the sheet opens on what matters now.
  const nowD=new Date(); const mondayOff=(nowD.getDay()+6)%7;
  const weekStart=new Date(nowD.getFullYear(),nowD.getMonth(),nowD.getDate()-mondayOff);
  const curMonth=nowD.getFullYear()+'-'+String(nowD.getMonth()+1).padStart(2,'0');
  const isCurMonth=(attMonth===curMonth);
  let rows='', hidden=0;
  for(let d=1;d<=days;d++){

    const isHol=hol.has(ds), hname=LT_HOLIDAY_NAMES[ds.slice(5)]||(isHol?'Public holiday':'');
    const past=isCurMonth&&!attShowPast&&(new Date(y,mo-1,d)<weekStart);
    if(past){hidden++;continue;}

      attPeople.map(p=>{ const k=ds+'|'+p.toLowerCase(), v=attCells[k]||'';
        return `<td class="pres-${attKind(v)}"><input data-k="${esc(k)}" value="${esc(v)}" autocomplete="off"></td>`; }).join('')+'</tr>';

        <button class="btn btn-out" style="padding:7px 12px" onclick="attShift(1)">›</button>
      </span>
      <span style="display:flex;align-items:center;gap:12px">
        <span id="att_state" class="syncstate"></span>
        <button class="btn btn-out" style="padding:7px 13px;font-size:12px" onclick="attAddPerson()">+ Person</button>
        <button class="btn btn-out" style="padding:7px 13px;font-size:12px"
          onclick="window.open('https://docs.google.com/spreadsheets/d/${esc(attId)}','_blank')">📊 Open sheet</button>
      </span>
    </div>
    <div class="pres-legend">
      <span><i class="pres-in"></i> blank = in</span>
      <span><i class="pres-out"></i> 0 = not in</span>

    </div>
    <div class="pres-wrap"><table class="pres">

      <tbody>${hidden?`<tr class="pres-fold"><td colspan="${attPeople.length+1}">
          <button class="foldbtn" onclick="attShowPast=true;renderPresence()">▸ Show ${hidden} earlier day${hidden===1?'':'s'} of this month</button></td></tr>`:''}
        ${(isCurMonth&&attShowPast)?`<tr class="pres-fold"><td colspan="${attPeople.length+1}">
          <button class="foldbtn" onclick="attShowPast=false;renderPresence()">▾ Hide days before this week</button></td></tr>`:''}
        ${rows}</tbody></table></div>
    ${attPeople.length?'':'<div class="empty-note" style="margin-top:12px">No people yet — they appear from projects automatically, or add one with “+ Person”.</div>'}`;
  setAttState('ok','Up to date');
  document.querySelectorAll('.pres input').forEach(inp=>{
    const commit=()=>{ const k=inp.dataset.k, v=inp.value.trim();
      if((attCells[k]||'')===v)return; attCells[k]=v; attDirty[k]=v;
      inp.parentElement.className='pres-'+attKind(v); attQueue(); };
    inp.oninput=()=>{ inp.parentElement.className='pres-'+attKind(inp.value); };
    inp.onchange=commit; inp.onblur=commit;
    inp.onkeydown=e=>{ const td=inp.parentElement,tr=td.parentElement,col=[...tr.children].indexOf(td); let t=null;
      if(e.key==='ArrowDown'||e.key==='Enter')t=tr.nextElementSibling&&tr.nextElementSibling.children[col];
      if(e.key==='ArrowUp')t=tr.previousElementSibling&&tr.previousElementSibling.children[col];
      if(e.key==='ArrowRight'&&inp.selectionStart===inp.value.length)t=td.nextElementSibling;
      if(e.key==='ArrowLeft'&&inp.selectionStart===0)t=td.previousElementSibling;
      const i=t&&t.querySelector&&t.querySelector('input'); if(i){e.preventDefault();commit();i.focus();i.select();} };
  });
  clearInterval(attPollTimer);
  attPollTimer=setInterval(async()=>{
    if(activeNav!=='presence'||Object.keys(attDirty).length)return;
    if(document.activeElement&&document.activeElement.closest('.pres'))return;

  },20000);
}

/* ---------- person bubbles ---------- */
/* 16 visually distinct colours; each person gets their own */
const BUB_COLORS=['#2f6df6','#0e9f8c','#f79009','#d92d20','#7a5af8','#e0459c',
                  '#0ba5ec','#66a80f','#b54708','#0f766e','#6d28d9','#be123c',
                  '#0369a1','#4d7c0f','#c2410c','#7c3aed'];
let peopleColorMap=null;
/* build a stable name -> colour map: every distinct person gets a different
   colour (until the palette wraps), assigned in alphabetical order so it
   stays consistent between sessions */
function buildColorMap(){
  const names=new Set();
  projects.forEach(p=>(p.data.people||[]).forEach(n=>{
    const v=(n||'').trim(); if(v)names.add(v.toLowerCase());
  }));
  (window._newPeople||[]).forEach(n=>{
    const v=(n||'').trim(); if(v)names.add(v.toLowerCase());
  });
  const sorted=[...names].sort();
  peopleColorMap={};
  sorted.forEach((n,i)=>{peopleColorMap[n]=BUB_COLORS[i%BUB_COLORS.length];});
  return peopleColorMap;
}
function bubColor(name){
  const key=(name||'').trim().toLowerCase(); if(!key)return BUB_COLORS[0];
  if(!peopleColorMap)buildColorMap();
  if(peopleColorMap[key])return peopleColorMap[key];
  // name not in the roster yet (just typed) — add it and re-assign
  buildColorMap();
  if(peopleColorMap[key])return peopleColorMap[key];
  let h=0; for(let i=0;i<key.length;i++)h=(h*31+key.charCodeAt(i))>>>0;
  return BUB_COLORS[h%BUB_COLORS.length];
}
function bubHtml(name,small){
  const n=(name||'').trim(); if(!n)return '';
  return `<span class="bub${small?' bub-sm':''}" style="background:${bubColor(n)}" title="${esc(n)}">${esc(n[0])}</span>`;
}
/* people assigned to a project (project-level, not per task) */
function projectPeople(d){ return Array.isArray(d.people)?d.people:[]; }
/* every person name used anywhere, for quick re-selection */
function knownPeople(){
  const seen=[];
  projects.forEach(p=>(p.data.people||[]).forEach(n=>{
    const v=(n||'').trim();
    if(v&&!seen.some(x=>x.toLowerCase()===v.toLowerCase()))seen.push(v);
  }));
  return seen.sort((a,b)=>a.localeCompare(b));
}
/* add/remove a person on a list, case-insensitive, returns new list */
function togglePerson(list,name){
  const v=(name||'').trim(); if(!v)return list;
  const i=list.findIndex(x=>x.toLowerCase()===v.toLowerCase());
  if(i>=0){list.splice(i,1);}else{list.push(v);}
  return list;
}
function bubblesHtml(people,max){
  if(!people.length)return '';
  const show=people.slice(0,max||3), extra=people.length-show.length;
  return `<span class="bubbles">${show.map(p=>bubHtml(p)).join('')}`+
    (extra>0?`<span class="bub bub-more" title="${esc(people.slice(max||3).join(', '))}">+${extra}</span>`:'')+
    `</span>`;
}

/* ---------- draw the 4 priority columns ---------- */
function drawTiles(){
  const area=document.getElementById('tileArea');
  if(!area)return;
  let list=projects.map((p,i)=>({p,i}));
  if(homeFilter!=='all')list=list.filter(x=>(x.p.data.status||'active')===homeFilter);
  if(homeSearch.trim()){
    const q=homeSearch.toLowerCase();
    list=list.filter(x=>(x.p.data.name||'').toLowerCase().includes(q)||
                        (x.p.data.description||'').toLowerCase().includes(q));
  }

  if(!projects.length){
    area.innerHTML=`<div class="empty-note" style="padding:30px">
      <b>No projects found in this Drive folder.</b><br><br>
      If you expected to see existing projects, you may be connected to a different
      <code>LABCORE_DATA</code> folder (a duplicate can happen if one was created before sharing).<br>
      Open the browser console (F12) — the line starting <code>[LABCORE]</code> shows which folder ID is in use.
    </div>`;
    return;
  }
  const LEVELS=['Urgent','High','Medium','Low'];
  area.innerHTML=`<div class="board">${LEVELS.map(lv=>
    `<div class="col col-${lv.toLowerCase()}">
       <div class="col-head"><h4>${lv}</h4><span class="col-count" id="cnt_${lv}">0</span></div>
       <div class="colbody" id="col_${lv}"></div>
     </div>`).join('')}</div>`;

  LEVELS.forEach(lv=>{
    // projects in this priority column
    let items=list.filter(x=>(x.p.data.priority||'Medium')===lv);
    // completed projects always sink to the bottom of the column;
    // otherwise soonest deadline on top, undated last
    items.sort((a,b)=>{
      const fin=x=>((x.p.data.status||'active')==='done'?1:0);
      if(fin(a)!==fin(b))return fin(a)-fin(b);
      const da=daysUntil(a.p.data.deadline), db=daysUntil(b.p.data.deadline);
      if(da===null&&db===null)return (a.p.data.name||'').localeCompare(b.p.data.name||'');
      if(da===null)return 1;
      if(db===null)return -1;
      return da-db;
    });
    const body=document.getElementById('col_'+lv);
    document.getElementById('cnt_'+lv).textContent=items.length;
    if(!items.length){body.innerHTML='<div class="col-empty">None</div>';return;}
    items.forEach(({p,i})=>{
      const el=document.createElement('div');
      el.className=`tile tile-l-${lv.toLowerCase()}`+((p.data.status||'active')==='done'?' done':'');
      el.innerHTML=tileHtml(p.data);
      el.onclick=()=>{selectedProjectIndex=i;renderProject();};
      body.appendChild(el);
    });
  });
}

/* ---------- automatic Drive sync when a project is opened ----------
   Skipped if the same project was synced moments ago, so the many
   renderProject() calls after small edits don't hammer the Drive API. */
const SYNC_TTL=20000;                 // ms before the same project re-syncs
let lastSync={};                      // folderId -> timestamp
async function autoSync(p,force){
  const now=Date.now();
  if(!force && lastSync[p.folderId] && now-lastSync[p.folderId]<SYNC_TTL){
    setSyncState('ok','Up to date');
    return;
  }
  lastSync[p.folderId]=now;
  setSyncState('busy','Checking Drive…');
  try{
    const changed=await syncProjectFiles(p,true);
    if(projects[selectedProjectIndex]!==p)return;   // user navigated away
    if(syncErrors){
      setSyncState('err',`Sync failed (${syncErrors})`);
      lastSync[p.folderId]=0;          // allow an immediate retry
      return;
    }
    if(changed){
      renderSamples(p); renderDrawings(p);
      setSyncState('ok','Updated from Drive');
      toast('New files found in Drive');
    }else{
      setSyncState('ok','Up to date');
    }
  }catch(e){
    setSyncState('err','Sync failed');
    console.warn('[LABCORE] autoSync',e);
  }
}
function setSyncState(kind,text){
  const el=document.getElementById('pj_syncstate'); if(!el)return;
  const icon=kind==='busy'?'<span class="loader"></span>':(kind==='err'?'⚠':'✓');
  el.className='syncstate '+kind;
  el.innerHTML=`${icon} <span>${esc(text)}</span>`;
  if(kind==='ok')setTimeout(()=>{if(el.classList.contains('ok'))el.style.opacity='.55';},2500);
  else el.style.opacity='1';
}

/* ============ FILE STAGING ============
   Browser file inputs REPLACE the selection each time you use them.
   These helpers keep a growing list per upload area instead, so you can
   pick files in several goes and remove any you chose by mistake before
   anything is sent to Drive.                                            */
const fileStage = {};
const stageHooks = {};      // key -> callback fired whenever the list changes
function stageInit(key, inputId, listId){
  fileStage[key] = fileStage[key] || [];
  const inp = document.getElementById(inputId);
  if(!inp) return;
  inp.onchange = e => {
    const arr = fileStage[key];
    [...e.target.files].forEach(f=>{
      const dup = arr.some(x=>x.name===f.name && x.size===f.size && x.lastModified===f.lastModified);
      if(!dup) arr.push(f);
    });
    e.target.value = '';            // lets you re-pick the same file later
    stageRender(key, listId);
  };
  stageRender(key, listId);
}
function stageRender(key, listId){
  if(stageHooks[key]) setTimeout(stageHooks[key],0);
  if(typeof updateNewSummary==='function') updateNewSummary();
  const el = document.getElementById(listId); if(!el) return;
  const arr = fileStage[key] || [];
  if(!arr.length){ el.innerHTML=''; return; }
  const kb = n => n<1024 ? n+' B' : (n<1048576 ? (n/1024).toFixed(0)+' KB' : (n/1048576).toFixed(1)+' MB');
  el.innerHTML = `<div class="stage-head">${arr.length} file(s) ready to upload
      <button type="button" class="stage-clear" data-k="${key}" data-l="${listId}">clear all</button></div>` +
    arr.map((f,i)=>`<div class="stage-row">
        <span class="stage-n" title="${esc(f.name)}">${esc(f.name)}</span>
        <span class="stage-s">${kb(f.size)}</span>
        <button type="button" class="stage-x" data-k="${key}" data-l="${listId}" data-i="${i}" title="Remove">✕</button>
      </div>`).join('');
  el.querySelectorAll('.stage-x').forEach(b=>{
    b.onclick=()=>{ fileStage[b.dataset.k].splice(+b.dataset.i,1);
      stageRender(b.dataset.k,b.dataset.l);
      if(typeof updateNewSummary==='function') updateNewSummary(); };
  });
  const ca=el.querySelector('.stage-clear');
  if(ca)ca.onclick=()=>{ fileStage[ca.dataset.k]=[]; stageRender(ca.dataset.k,ca.dataset.l);
      if(typeof updateNewSummary==='function') updateNewSummary(); };
}
function staged(key){ return fileStage[key] || []; }
function stageClear(key){ fileStage[key] = []; }

/* Download a Drive file directly, bypassing any cached Google editor view. */
async function downloadDriveFile(fileId,filename,btn){
  if(!fileId){toast('Nothing to download yet',true);return;}
  const label=btn?btn.textContent:'';
  if(btn){btn.disabled=true;btn.innerHTML='<span class="loader"></span> Fetching…';}
  try{
    const r=await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,
      {headers:{Authorization:'Bearer '+accessToken}});
    if(!r.ok)throw new Error('Drive returned '+r.status);
    const blob=await r.blob();
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=filename; document.body.appendChild(a); a.click();
    a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
    toast('Downloaded '+filename);
  }catch(e){ toast('Download failed: '+(e.message||e),true); }
  if(btn){btn.disabled=false;btn.textContent=label;}
}

/* ---------- busy state: nothing can be closed mid-save ----------
   Drive writes take a moment; while one is running the ✕ is disabled and
   a "Saving to Drive…" indicator is shown, so a popup can never be closed
   before the laser parameters or recipe have actually been stored.      */
let savingBusy = false;
function setBusy(on, msg){
  savingBusy = on;
  const b = document.getElementById('modalBusy');
  if(b){
    b.innerHTML = on ? `<span class="loader"></span> <span>${esc(msg||'Saving to Drive…')}</span>` : '';
    b.className = 'modalbusy' + (on ? ' on' : '');
  }

}

/* A project may only be written if its folder lives directly inside the
   pinned LABCORE_DATA. This makes writing to any other Drive impossible,
   whatever stale ids a browser may still hold. */
const parentCache={};
async function assertInsideRoot(folderId){
  if(!folderId)throw new Error('Project has no folder');
  if(parentCache[folderId]===rootFolderId)return;
  const r=await gapi.client.drive.files.get({fileId:folderId,fields:'id,parents,trashed'});
  const parents=(r.result&&r.result.parents)||[];
  if(r.result&&r.result.trashed)throw new Error('This project folder is in the Drive bin.');
  if(!parents.includes(rootFolderId)){
    throw new Error('Refusing to save: this project is not inside the lab LABCORE_DATA folder. '+
      'It belongs to a different Drive. Move or recreate it in the lab folder.');
  }
  parentCache[folderId]=rootFolderId;
}
async function saveProject(p){
  await assertInsideRoot(p.folderId);
  // did somebody else write this project while we had it open?
  let mt=null;
  try{ mt=await remoteMtime(p.jsonId); }catch(e){ /* offline check — just save */ }
  if(mt && p.mtime && mt!==p.mtime){
    try{
      const theirs=await fetchProjectData(p.jsonId);
      const base=p.base||theirs;
      p.data=mergeProject(base,p.data,theirs);
      toast('Merged with changes from another user');
    }catch(e){
      console.warn('[LABCORE] merge failed, keeping local copy',e);
    }
  }
  p.jsonId=await writeJson('project.json',p.folderId,p.data,p.jsonId);
  p.base=JSON.parse(JSON.stringify(p.data));
  try{ p.mtime=await remoteMtime(p.jsonId); }catch(e){ p.mtime=null; }
}

/* ---- projects deleted in Drive disappear from LabCore ----
   Re-list the project folders inside the lab root and drop any project
   whose folder is no longer there (trashed or deleted). Nothing in
   LabCore can delete a project; Drive is the only place that can.      */
let lastFolderCheck=0;
async function reconcileProjectsWithDrive(force){
  if(!accessToken||!rootFolderId)return false;
  if(!force&&Date.now()-lastFolderCheck<20000)return false;
  lastFolderCheck=Date.now();
  let ids=new Set(),pageToken=null;
  do{
    const r=await gapi.client.drive.files.list({
      q:`'${rootFolderId}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`,
      fields:'nextPageToken, files(id)',pageSize:1000,pageToken:pageToken||undefined});
    (r.result.files||[]).forEach(f=>ids.add(f.id));
    pageToken=r.result.nextPageToken;
  }while(pageToken);
  const gone=projects.filter(p=>!ids.has(p.folderId));
  if(!gone.length)return false;
  const names=gone.map(p=>p.data.name);
  const cur=projects[selectedProjectIndex];
  projects=projects.filter(p=>ids.has(p.folderId));
  if(cur&&!projects.includes(cur)){
    selectedProjectIndex=-1; closeModal(); goProjects();
  }else{
    selectedProjectIndex=projects.indexOf(cur);
    if(activeNav==='projects'&&selectedProjectIndex<0)renderHome();
  }
  toast('Removed from LabCore (deleted in Drive): '+names.join(', '));
  return true;
}

/* ---- live refresh: pick up other people's edits while a project is open ---- */
const PROJ_POLL=15000;
let pollTimer=null;
function startProjectPolling(){
  clearInterval(pollTimer);
  pollTimer=setInterval(checkProjectFreshness,PROJ_POLL);
}
async function checkProjectFreshness(){
  if(!accessToken)return;
  try{ if(await reconcileProjectsWithDrive(false))return; }catch(e){}
  const p=projects[selectedProjectIndex];
  if(!p)return;
  // never interrupt someone mid-edit or mid-save
  if(laserEditing||detailsEditing||savingBusy)return;
  if(document.getElementById('modalBg').classList.contains('open'))return;
  try{
    const mt=await remoteMtime(p.jsonId);
    if(!mt||mt===p.mtime)return;
    const theirs=await fetchProjectData(p.jsonId);
    // nothing unsaved locally -> just take their version
    p.data=same(p.data,p.base)?theirs:mergeProject(p.base||theirs,p.data,theirs);
    p.base=JSON.parse(JSON.stringify(p.data));
    p.mtime=mt;
    renderProject();
    toast('Project updated by another user');
  }catch(e){ /* transient network issues are not worth reporting */ }
}

/* ---------- Samples ---------- */
/* ---------- SAMPLES as tiles with parameter bubbles ---------- */
/* A sample's group: explicit group if set, otherwise its material. */
function sampleGroup(sm){ return (sm.group||sm.material||'').trim()||'Ungrouped'; }
/* Sample names only need to be unique inside their group, so outside the
   group context (popup titles, Excel, printouts, lists) a sample is shown
   as "Group / Name". */
function sampleFullName(sm){
  const g=sampleGroup(sm);
  return g!=='Ungrouped'?g+' / '+(sm.label||''):(sm.label||'');
}
/* identity = the group it is shown under + its name (unique inside a group) */
function sampleKey(sm){ return sampleGroup(sm).toLowerCase()+'|'+String(sm.label||'').trim().toLowerCase(); }
/* every material ever used, across all projects — for suggestions */
function allMaterials(){
  const set=new Map();
  projects.forEach(p=>(p.data.samples||[]).forEach(sm=>{
    const m=(sm.material||'').trim(); if(m&&!set.has(m.toLowerCase()))set.set(m.toLowerCase(),m); }));
  return [...set.values()].sort((a,b)=>a.localeCompare(b));
}
function projectGroups(p){
  const map=new Map();
  (p.data.samples||[]).forEach(sm=>{ const g=sampleGroup(sm); if(!map.has(g.toLowerCase()))map.set(g.toLowerCase(),g); });
  return [...map.values()].sort((a,b)=>a==='Ungrouped'?1:b==='Ungrouped'?-1:a.localeCompare(b));
}
let collapsedGroups={};          // projectFolderId|group -> true

function sampleTile(p,sm,si){
  const nFiles=(sm.files||[]).length;
  const hasLaser=hasValues(sm.laser);
  const hasRecipe=!!(sm.recipe&&(sm.recipe.rows||[]).length);
  const hasChem=hasRecipe||hasValues(sm.chem);
  const el=document.createElement('div');
  el.className='stile';
  el.innerHTML=`
    <div>
      <div class="stile-name">${esc(sm.label)}</div>
      <div class="stile-sub">${esc(sm.material||'no material')}</div>
    </div>
    <div class="stile-btns">
      <button class="pbtn laser${hasLaser?' filled':''}" title="Laser parameters">L</button>
      <button class="pbtn chem${hasChem?' filled':''}" title="Chemical recipe">R${hasRecipe&&sm.recipe.printedAt?'<span class="recdot" title="printed"></span>':''}</button>
      <button class="pbtn files${nFiles?' filled':''}" title="Photos &amp; files">${nFiles||'0'}</button>
    </div>`;
  el.onclick=()=>showSample(p,si);
  const [bL,bC,bF]=el.querySelectorAll('.pbtn');
  bL.onclick=e=>{e.stopPropagation();showParams(p,si,'laser');};
  bC.onclick=e=>{e.stopPropagation();showRecipe(p,si);};
  bF.onclick=e=>{e.stopPropagation();showFiles(p,si);};
  return el;
}

function renderSamples(p){
  const area=document.getElementById('sampleArea');
  if(!area)return;
  if(!p.data.samples.length){
    area.innerHTML='<div class="empty-note">No samples yet. Add one to record laser &amp; chemical parameters and upload photos.</div>';
    return;
  }
  // newest first, keeping real indices
  const order=p.data.samples.map((sm,si)=>({sm,si})).sort((a,b)=>{
    const ta=a.sm.created?Date.parse(a.sm.created):null, tb=b.sm.created?Date.parse(b.sm.created):null;
    if(ta&&tb&&ta!==tb)return tb-ta; return b.si-a.si;
  });
  const groups=projectGroups(p);
  area.innerHTML='';
  // a single group (or only "Ungrouped") → plain grid, no headers
  if(groups.length<=1){
    const grid=document.createElement('div'); grid.className='sgrid';
    order.forEach(({sm,si})=>grid.appendChild(sampleTile(p,sm,si)));
    area.appendChild(grid); return;
  }
  groups.forEach(g=>{
    const items=order.filter(x=>sampleGroup(x.sm).toLowerCase()===g.toLowerCase());
    const key=p.folderId+'|'+g.toLowerCase();
    const open=!collapsedGroups[key];
    const sec=document.createElement('div'); sec.className='sgroup'+(open?'':' closed');
    const withL=items.filter(x=>hasValues(x.sm.laser)).length;
    const withR=items.filter(x=>x.sm.recipe&&(x.sm.recipe.rows||[]).length).length;
    sec.innerHTML=`
      <div class="sgroup-head">
        <span class="sgroup-arrow">${open?'▾':'▸'}</span>
        <span class="sgroup-name">${esc(g)}</span>
        <span class="sgroup-n">${items.length} sample${items.length===1?'':'s'}
          <span class="sgroup-meta">· L ${withL}/${items.length} · R ${withR}/${items.length}</span></span>
        <button class="btn btn-out sgroup-add" title="Add a sample to this group">+ Add here</button>
      </div>
      <div class="sgrid sgroup-body"></div>`;
    sec.querySelector('.sgroup-head').onclick=e=>{
      if(e.target.closest('.sgroup-add'))return;
      collapsedGroups[key]=!collapsedGroups[key]; renderSamples(p);
    };
    sec.querySelector('.sgroup-add').onclick=e=>{e.stopPropagation();newSampleForm(p,g);};
    const body=sec.querySelector('.sgroup-body');
    items.forEach(({sm,si})=>body.appendChild(sampleTile(p,sm,si)));
    area.appendChild(sec);
  });
}
/* does a parameter group have any values filled in? */
function hasValues(o){
  if(!o)return false;
  return Object.keys(o).some(k=>{
    if(k.endsWith('_u'))return false;
    const v=o[k];
    if(v&&typeof v==='object')return hasValues(v);
    return v!==''&&v!==undefined&&v!==null;
  });
}

/* rows for a parameter group, reused by both modals */
function paramRows(sm,which){
  const laser=which==='laser';
  const s=laser?(sm.laser||{}):(sm.chem||{});
  const rows=laser?[
    ['Wavelength',s.wavelength,s.wavelength_u],['Average power',s.power,s.power_u],
    ['Pulse energy',s.energy,s.energy_u],['Frequency / rep. rate',s.frequency,s.frequency_u],
    ['Pulse duration',s.pulse,s.pulse_u],['Scan speed',s.speed,s.speed_u],
    ['Spot size',s.spot,s.spot_u],['Hatch spacing',s.hatch,s.hatch_u],
    ['Passes / repetitions',s.passes],['Source / model',s.source],['Notes',s.notes]
  ]:[
    ['Solution / electrolyte',s.solution],['Concentration',s.concentration,s.concentration_u],
    ['pH',s.ph],['Temperature (°C)',s.temp],['Voltage',s.voltage,s.voltage_u],
    ['Current density',s.current,s.current_u],['Duration',s.duration,s.duration_u],
    ['Process',s.process],['Notes',s.notes]
  ];
  let html=rows.map(([k,v,u])=>kvu(k,v,u)).join('');
  if(laser&&s.lines){
    const x=s.lines;
    html+=`<div class="row" style="border:none;padding-top:12px"><span class="k" style="font-weight:800;color:var(--ink);letter-spacing:.8px;font-size:11px">LINES</span></div>`+
      [['Wavelength',x.wavelength,x.wavelength_u],['Average power',x.power,x.power_u],['Pulse energy',x.energy,x.energy_u],
       ['Frequency / rep. rate',x.frequency,x.frequency_u],['Pulse duration',x.pulse,x.pulse_u],
       ['Scan speed',x.speed,x.speed_u],['Spot size',x.spot,x.spot_u],['Line spacing',x.spacing,x.spacing_u],
       ['Passes / repetitions',x.passes],['Source / model',x.source],['Notes',x.notes]]
      .map(([k,v,u])=>kvu(k,v,u)).join('');
  }
  return html;
}

function fmtStamp(v){
  const d=new Date(v);
  return isNaN(d)?String(v):d.toLocaleString(undefined,
    {year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}

/* ---- edit / create a recipe in LabCore (same structure as the printer) ---- */
function blankRecipe(sm){
  return {printedAt:'',sampleName:sampleFullName(sm)||'',recipeDateTime:nowStamp(),
          mode:'chem',logo:'',footer:'',rows:[]};
}
function nowStamp(){
  const d=new Date(),p2=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
}
const DEFAULT_PRESETS=['NaOH','H2O','Propanol','Ag','Quadrol','Build','Strike','IC copper'];
let customPresets=[];               // shared via Drive (config)
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function splitTimeValue(time=''){
  const raw=String(time||'').trim();
  const m=raw.match(/^(.+?)\s*(h|hr|hour|hours|min|m|sec|s|seconds?)$/i);
  if(!m)return {num:raw,unit:'min'};
  let u=m[2].toLowerCase();
  if(u==='m')u='min';
  else if(u==='sec'||u==='second'||u==='seconds')u='s';
  else if(u==='hr'||u==='hour'||u==='hours')u='h';
  return {num:m[1].trim(),unit:u};
}
function recDateFromSelects(){
  const d=document.getElementById('er_dy'),m=document.getElementById('er_dm'),y=document.getElementById('er_dyr');
  if(!d||!m||!y)return nowStamp();
  const day=parseInt(d.value,10),mon=parseInt(m.value,10),yr=parseInt(y.value,10);
  if(!day||isNaN(mon)||!yr)return nowStamp();
  const p2=n=>String(n).padStart(2,'0');
  const now=new Date();
  return `${yr}-${p2(mon+1)}-${p2(day)} ${p2(now.getHours())}:${p2(now.getMinutes())}`;
}

/* Every recipe LabCore already knows — from all projects' samples and the
   master print log — used to autofill a new recipe from a similar one. */
function allKnownRecipes(){
  const out=[];
  projects.forEach(pr=>(pr.data.samples||[]).forEach(sm=>{
    if(sm.recipe&&(sm.recipe.rows||[]).length)
      out.push({rec:sm.recipe,name:sm.recipe.sampleName||sampleFullName(sm),
                where:pr.data.name+' · '+sampleFullName(sm),
                when:sm.recipe.printedAt||sm.recipe.recipeDateTime||''});
  }));
  (printedLog||[]).forEach(e=>{
    if(e.recipe&&(e.recipe.rows||[]).length)
      out.push({rec:e.recipe,name:e.recipe.sampleName||e.sample,
                where:(e.project||'')+' · '+(e.sample||'')+' (printed)',
                when:e.printedAt||''});
  });
  // newest first, and drop exact duplicates of the same steps + name
  out.sort((a,b)=>new Date(b.when||0)-new Date(a.when||0));
  const seen=new Set(), uniq=[];
  out.forEach(o=>{
    const k=(o.name||'').toLowerCase()+'|'+JSON.stringify((o.rec.rows||[]).map(r=>[r.step,r.time,r.unit,r.us,r.temp]));
    if(seen.has(k))return; seen.add(k); uniq.push(o);
  });
  return uniq;
}
function suggestRecipes(q){
  const s=(q||'').trim().toLowerCase();
  if(s.length<2)return [];
  return allKnownRecipes().filter(o=>(o.name||'').toLowerCase().includes(s)).slice(0,8);
}

        <span class="sug-n">${steps.length} step(s)</span></div>`;

/* ---- steps list with drag-to-reorder ---- */
let dragFrom=null;
function drawRecRows(){
  const tb=document.getElementById('er_rows'); if(!tb)return;
  tb.innerHTML='';
  window._editRec.rows.forEach((r,i)=>{
    const row=document.createElement('div'); row.className='srow'; row.dataset.i=i;
    row.innerHTML=`
      <span class="snum" draggable="true" title="Drag to reorder">☰ ${i+1}</span>
      <input class="ci" value="${esc(r.step||'')}" placeholder="step">
      <input class="timei" value="${esc(r.time||'')}">
      <select class="timeu">
        ${['s','min','h'].map(u=>`<option value="${u}"${(r.unit||'min')===u?' selected':''}>${u==='s'?'sec':u}</option>`).join('')}
      </select>
      <input class="usi" type="checkbox" ${r.us?'checked':''} title="Ultrasound">
      <input class="tempi" value="${esc(r.temp||'')}" placeholder="20C">
      <button class="xbtn" title="Remove">×</button>`;
    const ci=row.querySelector('.ci'), ti=row.querySelector('.timei'), tu=row.querySelector('.timeu');
    ci.oninput=()=>{ r.step=ci.value;
      if(ci.value.trim().toUpperCase()==='H2O'&&!ti.value.trim())tu.value='s',r.unit='s'; };
    ti.oninput=()=>r.time=ti.value;
    tu.onchange=()=>r.unit=tu.value;
    row.querySelector('.usi').onchange=e=>r.us=e.target.checked;
    row.querySelector('.tempi').oninput=e=>r.temp=e.target.value;
    row.querySelector('.xbtn').onclick=()=>{window._editRec.rows.splice(i,1);drawRecRows();};
    const h=row.querySelector('.snum');
    h.ondragstart=ev=>{dragFrom=i;ev.dataTransfer.effectAllowed='move';
      ev.dataTransfer.setData('text/plain','__move__');setTimeout(()=>row.classList.add('dragging'),0);};
    h.ondragend=()=>{row.classList.remove('dragging');dragFrom=null;};
    row.ondragover=ev=>{ev.preventDefault();ev.stopPropagation();row.classList.add('dragover');};
    row.ondragleave=()=>row.classList.remove('dragover');
    row.ondrop=ev=>{
      ev.preventDefault();ev.stopPropagation();row.classList.remove('dragover');
      const data=ev.dataTransfer.getData('text/plain')||'';
      const rows=window._editRec.rows;
      if(data.startsWith('__preset__')){
        const nm=data.slice(10);
        rows.splice(i,0,{step:nm,time:'',unit:(nm.trim().toUpperCase()==='H2O')?'s':'min',us:false,temp:'',notes:''});
      }else if(dragFrom!==null&&dragFrom!==i){
        const [m]=rows.splice(dragFrom,1); rows.splice(i,0,m);
      }
      dragFrom=null; drawRecRows();
    };
    tb.appendChild(row);
  });
}
function stepListDragOver(ev){ev.preventDefault();}
function stepListDrop(ev){
  ev.preventDefault();
  const data=ev.dataTransfer.getData('text/plain')||'';
  if(data.startsWith('__preset__')){
    const nm=data.slice(10);
    window._editRec.rows.push({step:nm,time:'',
      unit:(nm.trim().toUpperCase()==='H2O')?'s':'min',us:false,temp:'',notes:''});
    drawRecRows();
  }
}
/* paste Step / Time / Notes columns from Excel */
function importPastedSteps(){
  const txt=(document.getElementById('er_paste').value||'').trim();
  if(!txt){toast('Nothing pasted',true);return;}
  let n=0;
  txt.split('\n').forEach(line=>{
    const parts=line.split(/\t|\s{2,}/).map(x=>x.trim()).filter(Boolean);
    if(!parts.length)return;
    const tv=splitTimeValue(parts[1]||'');
    window._editRec.rows.push({step:parts[0],time:tv.num,unit:tv.unit,
      us:false,temp:'',notes:parts.slice(2).join(' ')});
    n++;
  });
  document.getElementById('er_paste').value='';
  setRecMode('chem'); drawRecRows();
  toast(n+' step(s) imported');
}

async function saveRecipe(p,si,alsoPrint){
  const sm=p.data.samples[si];
  const rec=window._editRec;
  rec.recipeDateTime=recDateFromSelects();
  rec.sampleName=document.getElementById('er_name').value.trim()||sampleFullName(sm);
  rec.footer=document.getElementById('er_footer').value.trim();
  rec.logo=(document.getElementById('er_logo')||{}).value||'';
  rec.freeText=(document.getElementById('er_ft')||{}).value||'';
  rec.mode=rec.mode||'chem';
  if(rec.mode==='free'){
    if(!rec.freeText.trim()){toast('Enter the instructions',true);return;}
    rec.rows=rec.freeText.split('\n').filter(l=>l.trim()).map((l,i)=>{
      const parts=l.split(/\t|\s{2,}/).map(x=>x.trim()).filter(Boolean);
      return {index:i+1,step:parts[0]||l.trim(),time:parts[1]||'',unit:'',
              us:false,temp:'',notes:parts.slice(2).join(' ')};
    });
  }else{
    rec.rows=rec.rows.filter(r=>(r.step||'').trim()).map((r,i)=>({
      index:i+1,step:r.step,time:r.time||'',unit:r.unit||'min',
      us:!!r.us,temp:r.temp||'',notes:r.notes||''}));
    if(!rec.rows.length){toast('Add at least one step',true);return;}
  }
  sm.recipe=rec;
  try{
    await withSaving('Saving recipe to Drive…', async()=>{
      await saveProject(p); await writeParamsExcel(p);
    });
  }catch(e){ toast('Could not save: '+e.message,true); return; }
  if(alsoPrint){
    try{ await withSaving('Printing…', ()=>printSampleRecipe(p,si,!!rec.big));
         toast('Recipe saved and printed'); }
    catch(e){ toast('Saved, but printing failed: '+e.message,true); }
  }else{ toast('Recipe saved to Drive · spreadsheet updated'); }
  showSample(p,si); renderSamples(p);
}

    const results=await searchPrintedRecipes(q,12);
    if(!results.length){
      box.innerHTML=`<div class="empty-note" style="padding:16px">
        No printed recipes found for "${esc(q)}".<br><br>
        <span style="color:var(--mute)">Recipes appear here after they are printed from the thermal-printer
        page with Google-Sheet logging switched on. Try clearing the search box to list the most recent ones.</span>
      </div>`;
      return;

    box.innerHTML='';
    results.forEach((rec,i)=>{
      const card=document.createElement('div');
      card.className='reccard';
      card.innerHTML=`
        <div class="reccard-head">
          <div><b>${esc(rec.sampleName||'(unnamed)')}</b>

              ${esc(fmtStamp(rec.printedAt))} · ${(rec.rows||[]).length} step(s)</div></div>
          <button class="btn btn-acc" style="padding:7px 14px;font-size:12px">Attach</button>
        </div>

          ${esc((rec.rows||[]).map(r=>r.step).filter(Boolean).slice(0,4).join(' → '))}${(rec.rows||[]).length>4?' →…':''}
        </div>`;
      card.querySelector('button').onclick=async()=>{
        sm.recipe=rec;                      // stored verbatim, nothing lost

      box.appendChild(card);
    });
  }catch(e){
    box.innerHTML=`<div class="empty-note" style="padding:16px;color:var(--warn)">
      ${esc(e.message||String(e))}</div>`;
  }
}
function detachRecipe(p,si){

  const newGroup=(document.getElementById('sd_group')||{value:''}).value.trim();

  if(p.data.samples.some((x,i)=>i!==si&&sampleKey(x)===sampleKey({label,group:newGroup,material:newMaterial}))){

  const oldLabel=sm.label, oldGroup=(sm.group||'').trim();

    await withSaving('Saving sample…', async()=>{
      const fid=await locateSampleFolder(p,{label:oldLabel,group:oldGroup,folderId:sm.folderId});

/* ================= MILESTONE POPUP =================
   Click a ◆ on the timeline: mark it done / not done, attach files, open
   its folder. Files live in  PRJ_<name>/Milestones/<date> <text>/  and
   Drive stays the source of truth (deleting there removes them here).  */
function msFolderName(m){ return sampleFolderName((m.date||'')+' '+(m.text||'')).slice(0,120); }
async function locateMilestoneFolder(p,m){
  if(m.folderId){
    if(await driveAlive(m.folderId))return m.folderId;
    m.folderId=''; return null;                     // deleted in Drive
  }
  const root=await findSubfolder('Milestones',p.folderId);
  if(!root)return null;
  return await findSubfolder(msFolderName(m),root);
}
async function ensureMilestoneFolder(p,m){
  let fid=await locateMilestoneFolder(p,m);
  if(!fid){
    const root=await ensureSubfolder('Milestones',p.folderId);
    fid=await ensureSubfolder(msFolderName(m),root);
  }
  m.folderId=fid; return fid;
}
async function syncMilestoneFiles(p,m,save){
  try{
    const fid=await locateMilestoneFolder(p,m);
    const live=fid?await listFolderFiles(fid):[];
    if(fid)m.folderId=fid;
    const before=JSON.stringify((m.files||[]).map(f=>f.id).sort());
    m.files=live.map(f=>({id:f.id,name:f.name,link:f.webViewLink,thumb:f.thumbnailLink,type:inferType(f)}));
    const after=JSON.stringify(m.files.map(f=>f.id).sort());
    const changed=before!==after;
    if(changed&&save)await saveProject(p);
    return changed;
  }catch(e){ console.warn('[LABCORE] milestone sync failed',e); return false; }
}
function msKey(pi,mi){ return pi+'_'+mi; }
function openMilestone(pi,mi){
  const p=projects[pi]; const m=p&&(p.data.milestones||[])[mi];
  if(!m){toast('Milestone not found',true);return;}
  selectedProjectIndex=pi;

    <div class="empty-note" style="padding:8px 0 0;font-size:12px">Files are stored in the project folder under <code>Milestones/${esc(msFolderName(m))}</code>.</div>`);
  stageClear('ms'+k); stageInit('ms'+k,'msIn_'+k,'msStage_'+k);
  document.getElementById('msUp_'+k).onclick=()=>uploadMilestoneFiles(pi,mi);
  renderMilestoneHead(pi,mi); renderMilestoneGallery(pi,mi);
  // Drive is the source of truth: refresh the file list in the background
  syncMilestoneFiles(p,m,true).then(ch=>{ if(ch){renderMilestoneGallery(pi,mi);renderMilestoneHead(pi,mi);} });
}
function renderMilestoneHead(pi,mi){
  const p=projects[pi]; const m=p.data.milestones[mi]; const k=msKey(pi,mi);
  const head=document.getElementById('ms_head_'+k), btns=document.getElementById('ms_btns_'+k);
  if(!head||!btns)return;
  const today=new Date(); today.setHours(0,0,0,0);
  const dt=new Date(m.date+'T00:00:00'); const diff=Math.round((dt-today)/86400000);
  let status;
  if(m.done)status=`<span style="color:#12b76a;font-weight:700">✓ done${m.doneAt?' · '+esc(m.doneAt):''}</span>`;
  else if(diff<0)status=`<span style="color:#b42318;font-weight:700">overdue by ${-diff} day${-diff===1?'':'s'}</span>`;
  else if(diff===0)status=`<span style="color:var(--warn);font-weight:700">due today</span>`;
  else status=`in ${diff} day${diff===1?'':'s'}`;
  head.innerHTML=`<div class="msinfo">
    <b>Project</b><span style="cursor:pointer;text-decoration:underline dotted" onclick="closeModal();selectedProjectIndex=${pi};activeNav='projects';renderNav();renderProject()">${esc(p.data.name)}</span>
    <b>Date</b><span class="mono">${esc(m.date)}</span>
    <b>Status</b><span>${status}</span>
    <b>Files</b><span>${(m.files||[]).length}</span>
  </div>`;
  btns.innerHTML=`
    <button class="btn btn-acc" style="flex:1" onclick="toggleMilestoneDone(${pi},${mi})">${m.done?'↺ Mark as not done':'✓ Mark as done'}</button>
    <button class="btn btn-out" style="flex:1" onclick="openMilestoneFolder(${pi},${mi})">📁 Open folder</button>`;
}
function renderMilestoneGallery(pi,mi){
  const m=projects[pi].data.milestones[mi]; const g=document.getElementById('msGal_'+msKey(pi,mi));
  if(!g)return;
  const files=m.files||[];
  if(!files.length){g.innerHTML='<div class="empty-note" style="grid-column:1/-1">No files attached yet.</div>';return;}
  g.innerHTML='';
  files.forEach(f=>{
    const d=document.createElement('div');d.className='fcard';
    d.innerHTML=`${f.thumb?`<img src="${f.thumb}" referrerpolicy="no-referrer" onerror="this.style.display='none'">`:''}
      <div class="fmeta"><div class="ftype">${esc((f.type||'file').toUpperCase())}</div>
      <a href="${f.link}" target="_blank">${esc(f.name)}</a></div>`;
    g.appendChild(d);
  });
}
async function toggleMilestoneDone(pi,mi){
  const p=projects[pi]; const m=p.data.milestones[mi];
  m.done=!m.done;
  m.doneAt=m.done?new Date().toISOString().slice(0,10):'';
  setBusy(true,'Saving…');
  try{ await saveProject(p); toast(m.done?'Milestone marked as done':'Milestone reopened'); }
  catch(e){ m.done=!m.done; toast('Save failed: '+(e.message||e),true); }
  setBusy(false);
  renderMilestoneHead(pi,mi);
  if(activeNav==='timeline')renderTimeline();
}
async function uploadMilestoneFiles(pi,mi){
  const p=projects[pi]; const m=p.data.milestones[mi]; const k=msKey(pi,mi);
  const files=staged('ms'+k);
  if(!files.length){toast('Choose file(s) first',true);return;}
  const btn=document.getElementById('msUp_'+k); btn.innerHTML='<span class="loader"></span>';
  setBusy(true,'Uploading to Drive…');
  try{
    const fid=await ensureMilestoneFolder(p,m);
    m.files=m.files||[];
    for(const f of files){
      const r=await uploadFile(f,fid);
      m.files.push({id:r.id,name:r.name,link:r.webViewLink,thumb:r.thumbnailLink,type:inferType(r)});
    }
    await saveProject(p);
    stageClear('ms'+k); stageRender('ms'+k,'msStage_'+k);
    renderMilestoneGallery(pi,mi); renderMilestoneHead(pi,mi);
    if(activeNav==='timeline')renderTimeline();
    toast('Files attached');
  }catch(e){ toast('Upload failed: '+(e.message||e),true); }
  setBusy(false);
  if(document.getElementById('msUp_'+k))document.getElementById('msUp_'+k).textContent='Upload';
}
async function openMilestoneFolder(pi,mi){
  const p=projects[pi]; const m=p.data.milestones[mi];
  try{
    const had=m.folderId;
    const fid=await ensureMilestoneFolder(p,m);
    if(fid!==had)await saveProject(p);
    window.open('https://drive.google.com/drive/folders/'+fid,'_blank');
  }catch(e){ toast('Could not open folder: '+(e.message||e),true); }
}

/* older samples may still hold the retired chemical fields — show them read-only
   so nothing recorded before the switch to recipes is lost */
function legacyChemHtml(sm){
  const c=sm.chem||{};
  const rows=[['Solution / electrolyte',c.solution],['Concentration',c.concentration,c.concentration_u],
    ['pH',c.ph],['Temperature (°C)',c.temp],['Voltage',c.voltage,c.voltage_u],
    ['Current density',c.current,c.current_u],['Duration',c.duration,c.duration_u],
    ['Process',c.process],['Notes',c.notes]]
    .filter(([k,v])=>v!==undefined&&v!==''&&v!==null);
  if(!rows.length)return '';
  return `<details style="margin-top:16px">
      <summary>Legacy chemical parameters (recorded before recipes)</summary>
      <div style="margin-top:8px">${rows.map(([k,v,u])=>kvu(k,v,u)).join('')}</div>
    </details>`;
}

function kvu(k,v,u){const has=v!==undefined&&v!==''&&v!==null;return `<div class="row"><span class="k">${k}</span><span class="v">${has?esc(String(v))+(u?' '+esc(u):''):'—'}</span></div>`;}

async function doUpload(p,si){
  const files=staged('smp'+si);

/* ---------- Sample form (add / edit) ---------- */
/* ---------- NEW SAMPLE: name, material and files only ----------
   Laser parameters and the chemical recipe are added afterwards from
   the sample's own buttons, so creating a sample stays quick.        */
function newSampleForm(p,presetGroup){
  const groups=projectGroups(p).filter(g=>g!=='Ungrouped');
  const preset=(presetGroup&&presetGroup!=='Ungrouped')?presetGroup:'';
  const samplesByNew=(p.data.samples||[]).map((sm,si)=>({sm,si}))
    .sort((a,b)=>(Date.parse(b.sm.created||0)||b.si)-(Date.parse(a.sm.created||0)||a.si));
  const copyOpts=samplesByNew.map(({sm,si})=>{
    const has=[hasValues(sm.laser)?'L':'',(sm.recipe&&(sm.recipe.rows||[]).length)?'R':''].filter(Boolean).join('+');
    return `<option value="${si}">${esc(sampleFullName(sm))}${has?' · '+has:''}${sm.material?' · '+esc(sm.material):''}</option>`;
  }).join('');
  const groupOpts=`<option value="">— no group —</option>`+
    groups.map(g=>`<option value="${esc(g)}"${g===preset?' selected':''}>${esc(g)}</option>`).join('')+
    `<option value="__new__">+ New group…</option>`;
  openModal('<span class="tag laser">NEW SAMPLE</span> '+esc(p.data.name),`
    <div class="field"><label>1 · Group<span class="req">*</span> <span style="text-transform:none;letter-spacing:0;font-weight:400">(pick an existing one or make a new one)</span></label>
      <div style="display:flex;gap:8px">
        <select id="ns_groupsel" style="flex:1">${groupOpts}</select>
        <input id="ns_group" placeholder="New group name, e.g. Batch A, PVDF, control…" style="flex:1;display:none">
      </div></div>
    <div class="two">
      <div class="field"><label>2 · Sample name<span class="req">*</span></label>
        <input id="ns_label" placeholder="S-01"></div>
      <div class="field"><label>3 · Material</label>
        <input id="ns_material" list="ns_materials" placeholder="Ti-6Al-4V" autocomplete="off">
        <datalist id="ns_materials">${allMaterials().map(m=>`<option value="${esc(m)}">`).join('')}</datalist></div>
    </div>
    ${copyOpts?`<div class="field"><label>Copy parameters from</label>
      <div style="display:flex;gap:8px;align-items:center">
        <select id="ns_copy" style="flex:1"><option value="">— start empty —</option>${copyOpts}</select>
        <label class="chk"><input type="checkbox" id="ns_copyL"> laser</label>
        <label class="chk"><input type="checkbox" id="ns_copyR"> recipe</label>
      </div></div>`:''}
    <div class="field">
      <label>Photos / files <span style="text-transform:none;letter-spacing:0;font-weight:400">(optional)</span></label>
      <input type="file" id="ns_files" multiple>
      <div id="ns_filelist" class="stage-list"></div>
    </div>
    <div style="display:flex;gap:9px">
      <button class="btn btn-acc" style="flex:1" id="ns_save">Add sample</button>
      <button class="btn btn-out" onclick="closeModal()">Cancel</button>
    </div>
    <div class="errmsg" id="ns_err"></div>`);
  stageClear('nsFiles');
  stageInit('nsFiles','ns_files','ns_filelist');
  const gsel=document.getElementById('ns_groupsel'), ginp=document.getElementById('ns_group');
  const chosenGroup=()=>gsel.value==='__new__'?ginp.value.trim():gsel.value;
  gsel.onchange=()=>{
    const isNew=gsel.value==='__new__';
    ginp.style.display=isNew?'':'none';
    if(isNew)ginp.focus(); else document.getElementById('ns_label').focus();
  };
  // nothing to choose from yet → go straight to "new group"
  if(!groups.length){ gsel.value='__new__'; gsel.onchange(); }
  else if(preset){ gsel.value=preset; setTimeout(()=>document.getElementById('ns_label').focus(),0); }
  else setTimeout(()=>gsel.focus(),0);
  ginp.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();document.getElementById('ns_label').focus();} };
  // picking a source sample pre-fills the material
  const cp=document.getElementById('ns_copy');
  if(cp)cp.onchange=()=>{ const src=p.data.samples[Number(cp.value)]; if(!src)return;
    const mat=document.getElementById('ns_material'); if(!mat.value)mat.value=src.material||''; };
  document.getElementById('ns_label').onkeydown=e=>{
    if(e.key==='Enter'){e.preventDefault();document.getElementById('ns_material').focus();} };
  document.getElementById('ns_material').onkeydown=e=>{
    if(e.key==='Enter'){e.preventDefault();document.getElementById('ns_save').click();} };
  document.getElementById('ns_save').onclick=async()=>{
    const label=document.getElementById('ns_label').value.trim();
    const group=chosenGroup();
    const err=document.getElementById('ns_err');
    const fail=t=>{err.textContent=t;err.classList.add('show');};
    if(gsel.value==='__new__'&&!group){fail('Type a name for the new group (or pick an existing one).');return;}
    if(!label){fail('A sample name is required.');return;}
    const material=document.getElementById('ns_material').value.trim();
    if(p.data.samples.some(x=>sampleKey(x)===sampleKey({label,group,material}))){
      const eff=sampleGroup({label,group,material});
      fail(eff!=='Ungrouped'?`"${label}" already exists in group "${eff}". The same name is fine in a different group.`
                            :`"${label}" already exists among the samples without a group.`);
      return;}
    const btn=document.getElementById('ns_save');btn.innerHTML='<span class="loader"></span> Adding…';
    try{
      const sm={label,material,group,laser:{},files:[],created:new Date().toISOString()};
      const src=cp&&cp.value!==''?p.data.samples[Number(cp.value)]:null;
      if(src&&!document.getElementById('ns_copyL').checked&&!document.getElementById('ns_copyR').checked){
        fail('Tick laser and/or recipe to copy from '+sampleFullName(src)+', or set "Copy parameters from" back to empty.');
        btn.textContent='Add sample'; return;
      }
      if(src){
        if(document.getElementById('ns_copyL').checked&&src.laser)sm.laser=JSON.parse(JSON.stringify(src.laser));
        if(document.getElementById('ns_copyR').checked&&src.recipe){
          sm.recipe=JSON.parse(JSON.stringify(src.recipe));
          sm.recipe.printedAt='';                       // a copy has not been printed
          sm.recipe.sampleName=sampleFullName(sm);      // printout carries the new name
          sm.recipe.recipeDateTime=nowStamp();
        }
      }
      sm.folderId=await ensureSubfolder(sampleFolderName(label),await sampleParentFolder(p,sm));
      const files=staged('nsFiles');
      for(const f of files){
        const r=await uploadFile(f,sm.folderId);
        sm.files.push({id:r.id,name:r.name,type:inferType({mimeType:f.type,name:f.name}),
                       link:r.webViewLink,thumb:r.thumbnailLink});
      }
      p.data.samples.push(sm);
      collapsedGroups[p.folderId+'|'+sampleGroup(sm).toLowerCase()]=false;   // show the group it landed in
      await saveProject(p); await writeParamsExcel(p);
      closeModal(); renderProject();
      toast('Sample '+sampleFullName(sm)+' added'+(src?' (copied from '+sampleFullName(src)+')':''));
    }catch(e){
      fail('Could not add the sample: '+(e.message||e)); btn.textContent='Add sample';
    }
  };
}

/* a parameter row: value input + unit dropdown */
function prow(label,valId,val,unitId,unitVal,units,defU){
  const sel=units.map(u=>`<option${ (unitVal||defU)===u?' selected':''}>${u}</option>`).join('');
  return `<div class="field"><label>${label}</label>
    <div class="valunit"><input id="${valId}" value="${esc(val||'')}">
    <select id="${unitId}">${sel}</select></div></div>`;
}
function v(id){const el=document.getElementById(id);return el?el.value:'';}
</script>
</body>
</html>
