  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Archivo',sans-serif;
    min-height:100vh;
  }
  .mono{font-family:'Space Mono',monospace}
  button{font-family:inherit;cursor:pointer;border:none}
  input,select,textarea{font-family:inherit}

  /* TOP BAR */
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 26px;border-bottom:1px solid var(--line);
    background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
    position:sticky;top:0;z-index:50;
  }
  .logo{display:flex;align-items:center;gap:12px;cursor:pointer}
  .logo .mark{
    width:36px;height:36px;border-radius:9px;flex-shrink:0;
    background-image:var(--logo);
    background-size:cover;background-position:center;
    box-shadow:0 1px 4px rgba(16,24,40,.22);
  }
  /* big logo on the sign-in screen */
  .hero-logo{
    width:132px;height:132px;border-radius:30px;margin:0 auto 26px;
    background-image:var(--logo);
    background-size:cover;background-position:center;
    box-shadow:0 10px 30px rgba(16,24,40,.20), 0 2px 6px rgba(16,24,40,.10);
  }
  @media(max-width:640px){.hero-logo{width:104px;height:104px;border-radius:24px;margin-bottom:20px}}
  .logo h1{font-size:18px;font-weight:900;letter-spacing:2px}
  .logo span{color:var(--mute);font-size:11px;letter-spacing:3px;display:block}
  .userbox{display:flex;align-items:center;gap:14px;font-size:13px}
  .pill{
    padding:8px 16px;border-radius:var(--r);font-weight:700;font-size:13px;
    letter-spacing:.3px;transition:.15s;
  }
  .pill.go{background:var(--acc);color:#fff}
  .pill.go:hover{background:#2559d0}
  .pill.ghost{background:#fff;border:1px solid var(--line);color:var(--mute)}
  .pill.ghost:hover{border-color:var(--mute);color:var(--ink)}

  /* LAYOUT */
  .wrap{display:flex;min-height:calc(100vh - 63px);align-items:stretch}
  aside{
    width:225px;border-right:1px solid var(--line);padding:18px 14px;
    background:var(--panel);flex-shrink:0;overflow-y:auto;
    max-height:calc(100vh - 63px);position:sticky;top:63px;
  }
  @media(max-width:820px){
    aside{width:100%;position:static;max-height:none;border-right:none;border-bottom:1px solid var(--line)}
    .wrap{flex-direction:column}
  }
  /* sidebar navigation */
  nav{display:flex;flex-direction:column;gap:3px}
  .nav-group{font-size:10px;letter-spacing:1.6px;color:var(--mute);font-weight:800;
    text-transform:uppercase;margin:16px 0 7px 10px}
  .nav-group:first-child{margin-top:0}
  .navitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    padding:10px 12px;border-radius:var(--r);background:transparent;border:none;
    font-size:14px;font-weight:600;color:var(--ink);transition:.12s;cursor:pointer}
  .navitem:hover{background:var(--panel2)}
  .navitem.on{background:#eef3fe;color:#1d4fd0;font-weight:800}
  .navitem .ico{width:20px;text-align:center;font-size:15px;flex-shrink:0}
  .navitem.soon{color:#aab0ba;cursor:default}
  .navitem.soon:hover{background:transparent}
  .navitem .badge{margin-left:auto;font-size:9px;font-weight:800;letter-spacing:.5px;
    background:var(--panel2);color:var(--mute);padding:2px 7px;border-radius:20px}
  main{flex:1;padding:28px 32px;min-width:0}
  @media(max-width:640px){main{padding:20px 16px}}

  .sec-label{font-size:11px;letter-spacing:2px;color:var(--mute);font-weight:700;margin-bottom:12px;text-transform:uppercase}

  .pjlist{display:flex;flex-direction:column;gap:6px;margin-top:6px}
  .pjitem{
    padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);
    background:#fff;transition:.12s;position:relative;overflow:hidden;cursor:pointer;
  }
  .pjitem:hover{border-color:var(--acc);box-shadow:var(--shadow)}
  .pjitem.sel{border-color:var(--acc);background:#eef3fe}
  .pjitem.sel::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc)}
  .pjitem h4{font-size:14px;font-weight:700;margin-bottom:3px}
  .pjitem .meta{font-size:11px;color:var(--mute)}
  .status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
  .st-active{background:#12b76a}
  .st-done{background:var(--acc2)}
  .st-archived{background:var(--mute)}

  /* EMPTY / LOGIN STATES */
  .center-state{display:grid;place-items:center;min-height:60vh;text-align:center}
  .center-state .big{font-size:48px;font-weight:900;letter-spacing:-1px;margin-bottom:10px}
  .center-state p{color:var(--mute);max-width:420px;margin:0 auto 22px;line-height:1.6}

  /* CARDS / PANELS */
  .grid{display:grid;gap:20px}
  .panelbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;box-shadow:var(--shadow)}
  .panelbox h3{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:8px}
  .tag{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700;letter-spacing:.5px}
  .tag.laser{background:#eef3fe;color:var(--acc)}
  .tag.chem{background:#e6f6f3;color:var(--acc2)}
  .tag.file{background:var(--panel2);color:var(--mute)}

  .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .row:last-child{border:none}
  .row .k{color:var(--mute)}
  .row .v{font-weight:600}

  /* FORMS */
  label{display:block;font-size:11px;letter-spacing:1px;color:var(--mute);margin:0 0 6px;text-transform:uppercase}
  .field{margin-bottom:14px}
  input,select,textarea{
    width:100%;padding:11px 13px;background:#fff;border:1px solid var(--line);
    border-radius:var(--r);color:var(--ink);font-size:14px;transition:.12s;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(47,109,246,.12)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

  .btn{padding:12px 22px;border-radius:var(--r);font-weight:700;letter-spacing:.5px;font-size:13px;transition:.15s}
  .btn-acc{background:var(--acc);color:#fff}
  .btn-acc:hover{background:#2559d0}
  .btn-blue{background:var(--acc);color:#fff}
  .btn-blue:hover{background:#2559d0}
  .btn-out{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .btn-out:hover{border-color:var(--ink)}

  /* SAMPLES */
  .sample-card{border:1px solid var(--line);border-radius:10px;margin-bottom:16px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
  .sample-head{padding:14px 18px;background:var(--panel2);display:flex;justify-content:space-between;align-items:center;cursor:pointer}
  .sample-head h4{font-size:15px}
  .sample-head .sub{font-size:12px;color:var(--mute);margin-top:2px}
  .sample-body{padding:18px;display:none;border-top:1px solid var(--line)}
  .sample-body.open{display:block}
  .subgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:820px){.subgrid{grid-template-columns:1fr}}

  /* FILE GALLERY */
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:10px}
  .fcard{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff;font-size:11px}
  .fcard img{width:100%;height:90px;object-fit:cover;display:block;background:var(--panel2)}
  .fcard .fmeta{padding:7px 9px}
  .fcard .ftype{font-weight:700;font-size:9px;letter-spacing:1px;color:var(--mute)}
  .fcard a{color:var(--acc2);text-decoration:none;word-break:break-all}

  .toast{position:fixed;bottom:24px;right:24px;background:#fff;border:1px solid var(--acc);color:var(--ink);padding:14px 20px;border-radius:var(--r);z-index:200;font-size:13px;box-shadow:0 10px 40px rgba(16,24,40,.18);max-width:340px;display:none}
  .toast.err{border-color:var(--warn)}
  .toast.show{display:block;animation:pop .3s}
  @keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1}}

  .loader{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}

  .config-warn{background:#fff7e6;border:1px solid #f5c26b;color:#7a4b06;padding:14px 18px;border-radius:var(--r);font-size:13px;margin:16px 0;line-height:1.5}
  .config-warn code{background:#fff;padding:2px 6px;border-radius:3px;color:#7a4b06;border:1px solid #f0d6a8}

  .crumb{font-size:12px;color:var(--mute);margin-bottom:8px;letter-spacing:1px}
  .crumb b{color:var(--acc)}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
  .toolbar h2{font-size:26px;font-weight:900;letter-spacing:-.5px}
  .empty-note{color:var(--mute);font-size:13px;padding:20px;text-align:center;border:1px dashed var(--line);border-radius:var(--r)}
  details summary{cursor:pointer;color:var(--mute);font-size:12px;margin-top:8px}

  /* priority badge */
  .prio{font-size:11px;font-weight:800;letter-spacing:1px;padding:3px 10px;border-radius:20px;vertical-align:middle;margin-left:8px;text-transform:uppercase}
  .prio-low{background:#eef1f5;color:#5b6472}
  .prio-medium{background:#e7f0fe;color:#1d4fd0}
  .prio-high{background:#fff2e0;color:#b25a06}
  .prio-urgent{background:#fdeceb;color:#b42318}
  .prio-mini{font-size:9px;padding:1px 7px;margin-left:0}

  /* task checklist */
  .tasklist{display:flex;flex-direction:column;gap:6px}
  .taskrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;background:#fff;border:1px solid var(--line);border-radius:var(--r);font-size:14px}
  .taskdel{background:transparent;color:var(--mute);font-size:12px;padding:2px 6px;border-radius:4px}
  .taskdel:hover{color:var(--ink);background:var(--panel2)}
  input[type=checkbox]{accent-color:var(--acc)}

  .filelink{display:inline-block;color:var(--acc2);text-decoration:none;font-weight:600;font-size:14px;padding:8px 0;word-break:break-all}
  .filelink:hover{text-decoration:underline}

  /* ---- PROJECT TILES (home screen) ---- */
  /* ---- PRIORITY BOARD (4 columns) ---- */
  .board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-items:start}
  @media(max-width:1280px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:720px){.board{grid-template-columns:1fr}}
  .col{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:120px}
  .col-head{display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:4px 6px 12px;border-bottom:2px solid transparent;margin-bottom:12px}
  .col-head h4{font-size:12px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase}
  .col-count{font-size:11px;font-weight:800;background:#fff;border:1px solid var(--line);
    color:var(--mute);border-radius:20px;padding:2px 9px}
  .col-urgent .col-head{border-bottom-color:#d92d20}
  .col-urgent .col-head h4{color:#b42318}
  .col-high   .col-head{border-bottom-color:#f79009}
  .col-high   .col-head h4{color:#b25a06}
  .col-medium .col-head{border-bottom-color:#2f6df6}
  .col-medium .col-head h4{color:#1d4fd0}
  .col-low    .col-head{border-bottom-color:#98a2b3}
  .col-low    .col-head h4{color:#5b6472}
  .col .tile{margin-bottom:12px;min-height:0}
  .col .tile:last-child{margin-bottom:0}
  .col-empty{font-size:12px;color:var(--mute);text-align:center;padding:14px 6px;font-style:italic}

  /* ---- PERSON PICKER ---- */
  .people-pick{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}
  .pchip{display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 5px;border-radius:20px;
    border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--ink);transition:.12s}
  .pchip:hover{border-color:var(--acc)}
  .pchip.on{background:#eef3fe;border-color:var(--acc);color:#1d4fd0}
  .pchip .x{color:var(--mute);font-weight:700;margin-left:2px}
  .people-none{font-size:12px;color:var(--mute);font-style:italic}

  /* ---- PERSON BUBBLES ---- */
  .bubbles{display:inline-flex;align-items:center;flex-shrink:0}
  .bub{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
    font-size:11px;font-weight:800;color:#fff;border:2px solid #fff;margin-left:-6px;
    flex-shrink:0;text-transform:uppercase}
  .bub:first-child{margin-left:0}
  .bub-sm{width:22px;height:22px;font-size:10px;margin-left:0;border-width:1px}
  .bub-more{background:#98a2b3}

  .tilegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
  .tile{
    background:#fff;border:1px solid var(--line);border-left:5px solid var(--mute);
    border-radius:12px;padding:18px 20px;cursor:pointer;transition:.15s;
    box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-height:150px;
  }
  .tile:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
  .tile-l-low{border-left-color:#98a2b3}
  .tile-l-medium{border-left-color:#2f6df6}
  .tile-l-high{border-left-color:#f79009}
  .tile-l-urgent{border-left-color:#d92d20}
  .tile h3{font-size:17px;font-weight:800;line-height:1.3;letter-spacing:-.2px;text-transform:none;margin:0;display:block}
  .tile-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .tile-desc{font-size:13px;color:var(--mute);line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tile-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .tile-stats{font-size:12px;color:var(--mute)}

  /* deadline badge — colour reflects urgency of the date */
  .dl{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
      padding:4px 10px;border-radius:20px;white-space:nowrap}
  .dl-none{background:#f2f4f7;color:#98a2b3}
  .dl-far{background:#eef1f5;color:#5b6472}          /* > 30 days */
  .dl-soon{background:#fff8e6;color:#b25a06}         /* 8–30 days */
  .dl-near{background:#fff2e0;color:#c4500b}         /* 1–7 days  */
  .dl-today{background:#fdeceb;color:#b42318}        /* today/tomorrow */
  .dl-over{background:#b42318;color:#fff}            /* overdue   */

  /* completed project — whole tile goes green */
  .tile.done{background:#f0fdf4;border-color:#a7f3c4;border-left-color:#12b76a}
  .tile.done:hover{background:#e9fbef}
  .tile.done h3{color:#046c4e}
  .done-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;
    letter-spacing:.6px;background:#12b76a;color:#fff;padding:3px 9px;border-radius:20px}

  /* ---- FORM SECTIONS ---- */
  .fsec{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:22px;margin-bottom:18px;box-shadow:var(--shadow)}
  .fsec-head{display:flex;align-items:center;gap:11px;margin-bottom:18px;
    padding-bottom:13px;border-bottom:1px solid var(--line)}
  .fsec-num{width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;
    display:grid;place-items:center;font-size:13px;font-weight:800;flex-shrink:0}
  .fsec-head h3{font-size:15px;font-weight:800;letter-spacing:0;text-transform:none;margin:0}
  .fsec-head .hint{font-size:12px;color:var(--mute);margin-left:auto;font-weight:600}
  .req{color:var(--warn);margin-left:3px;font-weight:800}
  .invalid{border-color:var(--warn)!important;background:#fffafa}
  .errmsg{color:var(--warn);font-size:12px;font-weight:700;margin-top:6px;display:none}
  .errmsg.show{display:block}

  /* ---- CREATE PROJECT: 2x2 grid, fits one screen ---- */
  .np-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}
  @media(max-width:1000px){.np-grid{grid-template-columns:1fr}}
  .np-grid .fsec{margin-bottom:0;padding:16px 18px;display:flex;flex-direction:column;min-height:0}
  .np-grid .fsec-head{margin-bottom:12px;padding-bottom:10px}
  .np-grid .fsec-num{width:23px;height:23px;font-size:12px}
  .np-grid .fsec-head h3{font-size:14px}
  .np-grid .field{margin-bottom:10px}
  .np-grid label{font-size:10px;margin-bottom:4px}
  .np-grid input,.np-grid select,.np-grid textarea{padding:8px 11px;font-size:13px}
  .np-grid .people-pick{margin-bottom:7px;max-height:88px;overflow-y:auto}
  .np-grid .tasklist{max-height:104px;overflow-y:auto}
  .np-grid .taskrow{padding:6px 10px;font-size:13px}
  .np-grid .pchip{padding:3px 10px 3px 4px;font-size:12px}
  .np-scroll{overflow-y:auto;min-height:0}

  /* summary / create cell */
  .np-sum{display:flex;flex-direction:column;gap:9px;font-size:13px}
  .sumrow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
  .sumrow .k{color:var(--mute)}
  .sumrow .v{font-weight:700;text-align:right}
  .sum-miss{color:var(--warn);font-weight:700}
  .sum-ok{color:#12b76a;font-weight:700}

  /* ---- PROJECT PAGE 2x2 GRID ---- */
  .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  @media(max-width:1000px){.pgrid{grid-template-columns:1fr}}
  .pgrid .span2{grid-column:1/-1}
  .pgrid .panelbox{margin:0}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-bottom:14px;padding-bottom:11px;border-bottom:1px solid var(--line)}
  .panel-head h3{margin:0;font-size:13px;letter-spacing:1.4px;text-transform:uppercase;
    display:flex;align-items:center;gap:8px}

  .linesbox{margin-top:14px;padding:12px 14px;border:1px dashed var(--line);border-radius:10px;background:var(--panel2)}
  .chk{display:inline-flex;align-items:center;gap:5px;font-size:12px;text-transform:none;letter-spacing:0;
    margin:0;color:var(--ink);white-space:nowrap}
  .chk input{width:auto;margin:0}

  /* ---- SAMPLE GROUPS ---- */
  .sgroup{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;background:var(--panel2);overflow:hidden}
  .sgroup-head{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;user-select:none}
  .sgroup-head:hover{background:#e9ecf1}
  .sgroup-arrow{width:14px;color:var(--mute);font-size:13px}
  .sgroup-name{font-weight:800;font-size:14px}
  .sgroup-n{font-size:12px;color:var(--mute);margin-left:2px}
  .sgroup-meta{opacity:.8}
  .sgroup-add{margin-left:auto;padding:5px 11px;font-size:12px}
  .sgroup-body{padding:12px;background:#fff;border-top:1px solid var(--line)}
  .sgroup.closed .sgroup-body{display:none}

  /* ---- SAMPLE TILES ---- */
  .sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .stile{border:1px solid var(--line);border-radius:10px;padding:13px 14px;background:#fff;cursor:pointer;
    transition:.13s;display:flex;flex-direction:column;gap:10px}
  .stile:hover{box-shadow:var(--shadow-lg);border-color:var(--acc)}
  .stile-name{font-size:14px;font-weight:800;line-height:1.3}
  .stile:hover .stile-name{color:var(--acc)}
  .stile-sub{font-size:11px;color:var(--mute);margin-top:2px}
  .stile-btns{display:flex;gap:7px;margin-top:auto}
  .pbtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
    font-size:13px;font-weight:800;border:1.5px solid var(--line);background:#fff;
    color:var(--mute);transition:.12s;position:relative;flex-shrink:0}
  .pbtn:hover{transform:scale(1.08)}
  .pbtn.laser{border-color:#2f6df6;color:#2f6df6}
  .pbtn.laser.filled{background:#2f6df6;color:#fff}
  .pbtn.chem{border-color:#0e9f8c;color:#0e9f8c}
  .pbtn.chem.filled{background:#0e9f8c;color:#fff}
  .pbtn.files{border-color:#f79009;color:#b25a06;font-size:11px}
  .pbtn.files.filled{background:#f79009;color:#fff}

  /* ---- MODAL ---- */
  .modal-bg{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:300;
    display:none;align-items:center;justify-content:center;padding:20px}
  .modal-bg.open{display:flex}
  .modal{background:#fff;border-radius:14px;max-width:640px;width:100%;
    max-height:86vh;overflow-y:auto;box-shadow:0 20px 60px rgba(16,24,40,.3)}
  .modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
  .modal-head h3{font-size:16px;font-weight:800;margin:0;text-transform:none;letter-spacing:0}
  .modal-body{padding:20px 22px}
  .modal-x{background:transparent;font-size:20px;color:var(--mute);padding:2px 8px;border-radius:6px;line-height:1}
  .modal-x:hover{background:var(--panel2);color:var(--ink)}

  /* ---- RECIPE TABLE (printer format) ---- */
  .rectab{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
  .rectab th{text-align:left;font-size:10px;letter-spacing:1px;text-transform:uppercase;
    color:var(--mute);font-weight:800;padding:7px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
  .rectab td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  .rectab tr:last-child td{border-bottom:none}
  .rectab td.num{text-align:center;color:var(--mute);width:34px}
  .us-yes{background:#e7f0fe;color:#1d4fd0;font-size:10px;font-weight:800;padding:2px 6px;border-radius:4px}
  .recmeta{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--mute);margin-bottom:10px}
  .recfoot{margin-top:10px;font-size:12px;color:var(--mute);font-style:italic;
    background:var(--panel2);padding:9px 12px;border-radius:var(--r)}
  .reccard{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:10px;transition:.12s}
  .reccard:hover{border-color:var(--acc);box-shadow:var(--shadow)}
  .reccard-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .recdot{position:absolute;top:-2px;right:-2px;width:9px;height:9px;border-radius:50%;
    background:#f79009;border:1.5px solid #fff}

  /* ---- RECIPE EDITOR (ported from the printer page) ---- */
  .recedit{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:16px;align-items:start}
  @media(max-width:760px){.recedit{grid-template-columns:1fr}}
  .recedit-side{border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:11px}
  .side-t{font-family:'Space Mono',monospace;font-size:11px;color:var(--mute);font-weight:700;margin-bottom:5px}
  .side-h{font-family:'Space Mono',monospace;font-size:10px;color:var(--mute);margin-bottom:9px;line-height:1.4}
  .chip{position:relative;display:block;background:#fff;border:1px solid var(--line);border-radius:6px;
    padding:6px 9px;margin-bottom:5px;font-size:12px;font-weight:600;cursor:grab;transition:.12s}
  .chip:hover{border-color:var(--acc);color:var(--acc)}
  .chip:active{cursor:grabbing}
  .chipx{position:absolute;right:6px;top:50%;transform:translateY(-50%);color:var(--mute);font-size:13px;line-height:1}
  .chipx:hover{color:var(--ink)}

  .sugbox{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;
    border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow-lg);
    z-index:60;max-height:260px;overflow-y:auto}
  .sug{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
  .sug:last-child{border-bottom:none}
  .sug:hover{background:#eef3fe}
  .sug-w{font-size:11px;color:var(--mute);margin-left:7px;font-weight:600}
  .sug-s{font-size:11px;color:var(--mute);margin-top:3px}
  .sug-n{color:var(--acc);font-weight:700;margin-left:6px}

  .shdr,.srow{display:grid;grid-template-columns:52px minmax(0,1fr) 58px 64px 34px 64px 30px;
    gap:6px;align-items:center}
  .shdr{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--mute);
    font-weight:800;padding:0 2px 6px;text-align:center}
  .shdr span:nth-child(2){text-align:left}
  .srow{margin-bottom:5px}
  .srow.dragging{opacity:.45}
  .srow.dragover{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
  .srow input,.srow select{padding:7px 8px;font-size:13px}
  .srow .usi{width:auto;margin:0 auto;display:block}
  .snum{font-family:'Space Mono',monospace;font-size:11px;color:var(--mute);cursor:grab;
    background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 4px;text-align:center}
  .snum:active{cursor:grabbing}

const CLIENT_ID = '308515868361-fd5uo3s2k5vilcgo4otul5q5903jvb2t.apps.googleusercontent.com';

const SCOPES = 'https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/spreadsheets';
const APP_FOLDER = 'LABCORE_DATA';     // root folder created in your Drive
let tokenClient, gapiReady=false, gisReady=false, accessToken=null;
let rootFolderId=null;
let projects=[];           // {id(driveFileId), folderId, data:{...}}

/* ---------- UI helpers ---------- */
function toast(msg,isErr){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast show'+(isErr?' err':'');
  setTimeout(()=>t.className='toast',3500);
}

}

  document.getElementById('configWarn').innerHTML=
   `<div class="config-warn">⚠ Not configured yet. Open this file in a text editor and set

    Full setup steps are in the companion README.</div>`;
}

/* ---------- Google init ---------- */
let initError='';
let sheetsReady=false, sheetsError='';
function sheetsErrText(e){
  const m=(e&&e.result&&e.result.error&&e.result.error.message)||(e&&e.message)||JSON.stringify(e||{});
  return /has not been used|SERVICE_DISABLED|disabled/i.test(m)
    ? 'Google Sheets API is not enabled for this Cloud project. Enable it at '+
      'https://console.developers.google.com/apis/api/sheets.googleapis.com/overview'+
      (m.match(/project (\d+)/)?'?project='+m.match(/project (\d+)/)[1]:'')+
      ' and wait a few minutes.'
    : m;
}
function gapiInit(){
  if(typeof gapi==='undefined'){
    initError='Google API script did not load. An ad-blocker or the network may be blocking apis.google.com.';
    showInitError(); return;
  }
  gapi.load('client',async()=>{
    try{
      await gapi.client.init({apiKey:API_KEY,
        discoveryDocs:['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest']});
      gapiReady=true; initError=''; hideInitError();

      gapi.client.load('https://sheets.googleapis.com/$discovery/rest?version=v4')
        .then(()=>{sheetsReady=true;})
        .catch(e=>{sheetsReady=false;sheetsError=sheetsErrText(e);console.warn('[LABCORE] Sheets API unavailable:',sheetsError);});
    }catch(e){
      const detail=(e&&(e.details||e.message))||JSON.stringify(e||{});
      const addrProblem=/referer|referrer|origin|API key not valid|API_KEY_HTTP_REFERRER_BLOCKED/i.test(detail);
      initError='Google could not start.\n\n'+detail+(addrProblem
        ? '\n\nThis address ('+location.origin+') is not allowed for your API key. In Google Cloud Console → '+
          'Credentials → your API key → Application restrictions → Websites, add:\n    '+location.origin+'/*'+
          '\n\nAnd under your OAuth Client ID → Authorized JavaScript origins, add:\n    '+location.origin+'   (no wildcard, no trailing slash)'

}
function showInitError(){
  const el=document.getElementById('configWarn'); if(!el)return;
  el.innerHTML='<div class="config-warn" style="white-space:pre-wrap;text-align:left">'+
    esc(initError)+'</div>';
}
function hideInitError(){
  const el=document.getElementById('configWarn'); if(el)el.innerHTML='';
}
/* Sign-in without re-approving every reload.
   Nothing is stored on disk: the token lives in memory only, and on load we
   ask Google for a fresh one silently (prompt:''). Google grants it when the
   browser still has a Google session and this app was approved before, so
   there is no prompt. If it can't, the normal Connect screen is shown. */
let authUserInitiated = false;  // true only when the person clicked Connect
let refreshTimer = null;
let signedOut = false;          // set when the user disconnects on purpose

function gisInit(){
  if(typeof google==='undefined'||!google.accounts||!google.accounts.oauth2){
    initError='Google sign-in script did not load. An ad-blocker or the network may be blocking accounts.google.com.';
    showInitError(); return;
  }
  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID, scope:SCOPES,
    callback:async(resp)=>{
      if(resp.error){
        // a failed silent attempt just means "ask the user" — not an error,
        // so only report it when the person actually pressed Connect
        if(authUserInitiated) toast('Sign-in failed: '+resp.error,true);
        authUserInitiated=false;
        showLoginScreen();
        return;
      }
      authUserInitiated=false;
      accessToken=resp.access_token;
      gapi.client.setToken({access_token:accessToken});
      scheduleTokenRefresh(resp.expires_in);
      const first = !document.getElementById('mainView').dataset.connected;
      document.getElementById('mainView').dataset.connected='1';
      if(first) await onConnected();
    }
  });
  gisReady=true;
}
/* keep the session alive: tokens last about an hour, so renew a little early */
function scheduleTokenRefresh(expiresIn){
  clearTimeout(refreshTimer);
  const secs = Math.max(60, (parseInt(expiresIn,10)||3600) - 300);
  refreshTimer = setTimeout(()=>{
    if(signedOut) return;
    try{ tokenClient.requestAccessToken({prompt:''}); }catch(e){}
  }, secs*1000);
}
/* try to restore the session with no prompt at all */
let silentTried = false;
function trySilentSignIn(){
  if(!gisReady || accessToken || signedOut || silentTried) return;
  silentTried = true;
  try{ tokenClient.requestAccessToken({prompt:''}); }
  catch(e){ showLoginScreen(); }
}

/* ---------- Drive: folder + file helpers ---------- */
async function ensureRootFolder(){
  // 1. pinned folder (the normal case once set up)
  if(PINNED_ROOT_ID){
    try{ localStorage.removeItem('labcore_root'); }catch(e){}
    try{
      const chk=await gapi.client.drive.files.get({fileId:PINNED_ROOT_ID,
        fields:'id,name,trashed,owners(emailAddress),capabilities(canEdit)'});
      const f=chk.result;
      if(f.trashed)throw new Error('The pinned LABCORE_DATA folder is in the bin.');
      if(f.capabilities&&f.capabilities.canEdit===false)
        throw new Error('You can see the lab folder but cannot edit it. Ask for Editor access.');
      rootFolderId=PINNED_ROOT_ID;
      rootOwner=(f.owners&&f.owners[0]&&f.owners[0].emailAddress)||'';
      return;
    }catch(e){
      const msg=(e&&e.status===404)
        ? 'This Google account cannot see the lab LABCORE_DATA folder. '+
          'Ask the lab account owner to share it with you (Editor), then reload.'
        : (e.message||String(e));
      throw new Error(msg);
    }
  }
  // 2. not pinned yet (first-time setup only): a folder saved from "Find my projects"
  try{
    const saved=localStorage.getItem('labcore_root');
    if(saved){
      const chk=await gapi.client.drive.files.get({fileId:saved,fields:'id,trashed'});
      if(chk.result&&!chk.result.trashed){rootFolderId=saved;return;}
    }
  }catch(e){}
  // 3. otherwise list what this account can see — but NEVER create one silently
  const q=`name='${APP_FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false`;
  const r=await gapi.client.drive.files.list({q,fields:'files(id,name,ownedByMe,owners(emailAddress))',pageSize:100});
  const found=r.result.files||[];
  if(found.length===1){ rootFolderId=found[0].id; return; }
  if(found.length>1){
    throw new Error('SEVERAL_ROOTS:'+JSON.stringify(found.map(f=>({id:f.id,
      owner:(f.owners&&f.owners[0]&&f.owners[0].emailAddress)||'?'}))));
  }
  throw new Error('No LABCORE_DATA folder is visible to this account, and LabCore will not create one on its own. '+
    'Sign in with the lab account, or ask for the lab folder to be shared with you.');
}
let rootOwner='';
let signedInEmail='';
async function createFolder(name,parentId){
  const c=await gapi.client.drive.files.create({
    resource:{name,mimeType:'application/vnd.google-apps.folder',parents:[parentId]},fields:'id'});
  return c.result.id;
}
/* write/update a JSON file via multipart upload */
async function writeJson(name,parentId,obj,existingId){
  // Never create a second file with the same name in the same folder.
  // If the caller lost track of the id, look it up before deciding to POST.
  if(!existingId){
    try{ existingId=await findFile(name,parentId); }catch(e){ existingId=null; }
  }
  const boundary='-------labcore'+Date.now();
  const meta=existingId?{}:{name,parents:[parentId],mimeType:'application/json'};
  const body=
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n`+
    JSON.stringify(meta)+
    `\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n`+
    JSON.stringify(obj,null,2)+
    `\r\n--${boundary}--`;
  const path=existingId?`/upload/drive/v3/files/${existingId}`:'/upload/drive/v3/files';
  const r=await gapi.client.request({
    path,method:existingId?'PATCH':'POST',
    params:{uploadType:'multipart'},
    headers:{'Content-Type':`multipart/related; boundary=${boundary}`},
    body});
  return r.result.id;
}
async function readJson(fileId){
  const r=await gapi.client.drive.files.get({fileId,alt:'media'});
  return typeof r.result==='string'?JSON.parse(r.result):r.result;
}
/* upload a binary File object */
async function uploadFile(file,parentId){
  const meta={name:file.name,parents:[parentId]};
  const reader=await file.arrayBuffer();
  const boundary='-------labfile'+Date.now()+Math.random().toString(36).slice(2);
  const head=`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n`+JSON.stringify(meta)+`\r\n--${boundary}\r\nContent-Type: ${file.type||'application/octet-stream'}\r\n\r\n`;
  const tail=`\r\n--${boundary}--`;
  const blob=new Blob([head,reader,tail]);
  const resp=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink,thumbnailLink',{
    method:'POST',
    headers:{Authorization:'Bearer '+accessToken,'Content-Type':`multipart/related; boundary=${boundary}`},
    body:blob});
  if(!resp.ok){throw new Error('Drive upload failed ('+resp.status+'): '+(await resp.text()).slice(0,160));}
  return await resp.json();
}
/* upload raw bytes (Blob) as a named file, optionally overwriting existing id */
async function uploadBlob(name,parentId,blob,mime,existingId){
  const meta=existingId?{}:{name,parents:[parentId]};
  const boundary='-------labblob'+Date.now()+Math.random().toString(36).slice(2);
  const head=`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n`+JSON.stringify(meta)+`\r\n--${boundary}\r\nContent-Type: ${mime}\r\n\r\n`;
  const tail=`\r\n--${boundary}--`;
  const body=new Blob([head,blob,tail]);
  const path=existingId?`https://www.googleapis.com/upload/drive/v3/files/${existingId}?uploadType=multipart&fields=id,name,webViewLink`
                       :`https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink`;
  const resp=await fetch(path,{method:existingId?'PATCH':'POST',
    headers:{Authorization:'Bearer '+accessToken,'Content-Type':`multipart/related; boundary=${boundary}`},body});
  if(!resp.ok){throw new Error('Drive upload failed ('+resp.status+'): '+(await resp.text()).slice(0,160));}
  return await resp.json();
}
/* find a subfolder by name under a parent, creating it if missing */
async function ensureSubfolder(name,parentId){
  const safe=name.replace(/'/g,"\\'");
  const r=await gapi.client.drive.files.list({
    q:`name='${safe}' and mimeType='application/vnd.google-apps.folder' and '${parentId}' in parents and trashed=false`,
    fields:'files(id)'});
  if(r.result.files.length)return r.result.files[0].id;
  return await createFolder(name,parentId);
}
/* The Drive folder for a sample is named exactly like the sample.
   Drive allows spaces and most punctuation; only / and \ are not allowed. */
function sampleFolderName(label){
  return String(label||'').replace(/[\\/]/g,'-').trim()||'unnamed sample';
}
/* Is a Drive file/folder still alive (not trashed, not deleted)? */
async function driveAlive(fileId){
  if(!fileId)return false;
  try{
    const r=await gapi.client.drive.files.get({fileId,fields:'id,trashed'});
    return !!(r.result&&!r.result.trashed);
  }catch(e){
    if(e&&e.status===404)return false;           // deleted permanently
    throw e;                                     // network etc. — caller decides
  }
}
async function renameDriveFolder(fileId,newName){
  await gapi.client.drive.files.update({fileId,resource:{name:newName}});
}
/* Parent folder for a sample: the group's subfolder when the sample has an
   explicit group, otherwise the project folder itself. Created if missing. */
async function sampleParentFolder(p,sm){
  const g=(sm.group||'').trim();
  if(!g)return p.folderId;
  return await ensureSubfolder(sampleFolderName(g),p.folderId);
}
/* move a Drive file/folder to another parent (used when a sample changes group) */
async function moveDriveItem(fileId,newParentId){
  const r=await gapi.client.drive.files.get({fileId,fields:'parents'});
  const old=(r.result.parents||[]).join(',');
  if(old===newParentId)return;
  await gapi.client.drive.files.update({fileId,addParents:newParentId,removeParents:old,fields:'id,parents'});
}

/* find a folder by name under a parent WITHOUT creating it (null if absent) */
async function findSubfolder(name,parentId){
  const safe=name.replace(/'/g,"\\'");
  const r=await gapi.client.drive.files.list({
    q:`name='${safe}' and mimeType='application/vnd.google-apps.folder' and '${parentId}' in parents and trashed=false`,
    fields:'files(id)'});
  return r.result.files.length?r.result.files[0].id:null;
}
/* list every real file (not folders) inside a Drive folder */
async function listFolderFiles(folderId){
  let out=[],pageToken=null;
  do{
    const r=await gapi.client.drive.files.list({
      q:`'${folderId}' in parents and mimeType!='application/vnd.google-apps.folder' and trashed=false`,
      fields:'nextPageToken, files(id,name,mimeType,webViewLink,thumbnailLink,createdTime)',
      pageSize:1000,orderBy:'createdTime desc',pageToken:pageToken||undefined});
    out=out.concat(r.result.files||[]);
    pageToken=r.result.nextPageToken;
  }while(pageToken);
  return out;
}
/* guess a category for files that were uploaded straight into Drive */
function inferType(f){
  const m=(f.mimeType||'').toLowerCase(), n=(f.name||'').toLowerCase();
  if(m.startsWith('image/'))return 'photo';
  if(m.startsWith('video/'))return 'photo';
  if(/\.(dwg|dxf|step|stp|iges|igs|stl|svg|ai)$/.test(n))return 'drawing';
  if(m==='application/pdf'||/\.(pdf|docx?|txt|rtf|odt|xlsx?|csv|pptx?)$/.test(n))return 'report';
  return 'drawing';
}
/* Make Drive the source of truth for a sample's files: read the sample folder
   and rebuild the file list, keeping any category labels already chosen.
   Returns true if anything changed. */
/* find a sample's folder: by stored id, by its exact name, or by the old
   Sample_<label> name (renaming it on the way so names match from now on) */
async function locateSampleFolder(p,sm){
  if(sm.folderId){
    if(await driveAlive(sm.folderId))return sm.folderId;
    return null;                                   // it was deleted in Drive
  }
  const want=sampleFolderName(sm.label);
  let fid=null;
  if((sm.group||'').trim()){
    const gf=await findSubfolder(sampleFolderName(sm.group),p.folderId);
    if(gf)fid=await findSubfolder(want,gf);
  }
  if(!fid)fid=await findSubfolder(want,p.folderId);
  if(fid)return fid;
  const legacy='Sample_'+String(sm.label||'').replace(/[^\w-]+/g,'_');
  fid=await findSubfolder(legacy,p.folderId);
  if(fid){ try{ await renameDriveFolder(fid,want); }catch(e){} return fid; }
  return null;
}
/* a sample whose folder vanished while its popup was open */
async function dropDeletedSample(p,si){
  const name=p.data.samples[si]?p.data.samples[si].label:'';
  p.data.samples.splice(si,1); deletedSamples=[];
  laserEditing=false; detailsEditing=false;
  document.getElementById('modalBg').classList.remove('open');
  try{ await saveProject(p); await writeParamsExcel(p); }catch(e){}
  renderSamples(p);
  toast('"'+name+'" was deleted in Drive and has been removed from LabCore');
}
/* samples whose Drive folder was deleted — set during a sync, acted on after */
let deletedSamples=[];

async function syncSampleFiles(p,si,save){
  const sm=p.data.samples[si];
  try{
    const hadFolder=!!sm.folderId;
    const fid=await locateSampleFolder(p,sm);
    if(!fid){
      if(hadFolder){
        // the sample had a folder and it is gone: the sample was deleted in Drive
        deletedSamples.push(si);
        return true;
      }
      return false;                              // never had a folder yet
    }
    sm.folderId=fid;
    const live=await listFolderFiles(fid);
    const known={}; (sm.files||[]).forEach(f=>{if(f.id)known[f.id]=f.type;});
    const before=JSON.stringify((sm.files||[]).map(f=>f.id).sort());
    sm.files=live.map(f=>({id:f.id,name:f.name,
      type:known[f.id]||inferType(f),link:f.webViewLink,thumb:f.thumbnailLink}));
    const after=JSON.stringify(sm.files.map(f=>f.id).sort());
    const changed=before!==after;
    if(changed&&save)await saveProject(p);
    return changed;
  }catch(e){ console.warn('[LABCORE] sync failed for',sm.label,e); syncErrors++; return false; }
}
/* same for the project-level Drawings folder */
async function syncDrawings(p,save){
  try{
    const fid=await findSubfolder('Drawings',p.folderId);
    if(!fid)return false;
    const live=await listFolderFiles(fid);
    const known={}; (p.data.drawings||[]).forEach(f=>{if(f.id)known[f.id]=true;});
    const before=JSON.stringify((p.data.drawings||[]).map(f=>f.id).sort());
    p.data.drawings=live.map(f=>({id:f.id,name:f.name,link:f.webViewLink,thumb:f.thumbnailLink}));
    const after=JSON.stringify(p.data.drawings.map(f=>f.id).sort());
    const changed=before!==after;
    if(changed&&save)await saveProject(p);
    return changed;
  }catch(e){ console.warn('[LABCORE] drawings sync failed',e); syncErrors++; return false; }
}
let syncErrors=0;
/* refresh every sample + drawings for a project (batched) */
async function syncProjectFiles(p,save){
  syncErrors=0; deletedSamples=[];
  let changed=await syncDrawings(p,false);
  const idx=p.data.samples.map((_,i)=>i);
  const BATCH=6;
  for(let i=0;i<idx.length;i+=BATCH){
    const res=await Promise.all(idx.slice(i,i+BATCH).map(si=>syncSampleFiles(p,si,false)));
    if(res.some(Boolean))changed=true;
  }
  if(deletedSamples.length){
    const gone=deletedSamples.slice().sort((a,b)=>b-a);       // remove from the end
    const names=gone.map(i=>p.data.samples[i].label);
    gone.forEach(i=>p.data.samples.splice(i,1));
    deletedSamples=[];
    changed=true;
    toast('Removed from LabCore (folder deleted in Drive): '+names.join(', '));
    try{ await writeParamsExcel(p); }catch(e){}
  }
  if(changed&&save)await saveProject(p);
  return changed;
}

/* ============ RECIPE LOGGER BRIDGE (read-only; printer app untouched) ====
   Uses the existing Apps Script endpoint:  ?action=search&q=<name>&limit=N
   Returns recipes in the printer's own format:
   {printedAt, sampleName, recipeDateTime, logo, footer, rows:[{step,time,us,temp,notes}]}  */
async function searchPrintedRecipes(q,limit){
  const url=(labConfig.appsScriptUrl||'').trim();
  if(!url)throw new Error('No Recipe Logger URL set — open Settings in the sidebar.');
  const sep=url.indexOf('?')>=0?'&':'?';
  const r=await fetch(`${url}${sep}action=search&q=${encodeURIComponent(q||'')}&limit=${limit||10}`,
                      {signal:AbortSignal.timeout(10000)});
  const j=await r.json();
  if(!j.ok)throw new Error(j.error||'search failed');
  return j.results||[];
}

/* Remove duplicate copies of a file in a folder, keeping the newest.
   Returns the id to keep. Used to clean up folders that accumulated
   several project.json files from the earlier bug. */
async function dedupeByName(name,parentId){
  const safe=name.replace(/'/g,"\\'");
  const r=await gapi.client.drive.files.list({
    q:`name='${safe}' and '${parentId}' in parents and trashed=false`,
    fields:'files(id,modifiedTime)',pageSize:100});
  const files=(r.result.files||[]).slice()
    .sort((a,b)=>new Date(b.modifiedTime)-new Date(a.modifiedTime));
  if(files.length<=1)return files[0]?files[0].id:null;
  for(const f of files.slice(1)){
    try{ await gapi.client.drive.files.update({fileId:f.id,resource:{trashed:true}}); }
    catch(e){ console.warn('[LABCORE] could not trash duplicate',f.id,e); }
  }
  console.log(`[LABCORE] trashed ${files.length-1} duplicate ${name} in ${parentId}`);
  return files[0].id;
}

/* find a file by exact name under a parent */
async function findFile(name,parentId){
  const safe=name.replace(/'/g,"\\'");
  const r=await gapi.client.drive.files.list({
    q:`name='${safe}' and '${parentId}' in parents and trashed=false`,fields:'files(id)'});
  return r.result.files.length?r.result.files[0].id:null;
}
/* Build/refresh the per-project parameters .xlsx.
   Layout: parameters down the ROWS, each sample is a COLUMN.
   Two sheets: Laser and Chemical. */
async function writeParamsExcel(p){
  const samples=p.data.samples;
  const fmt=(v,u)=>{ if(v===undefined||v===null||v==='')return ''; return u?`${v} ${u}`:`${v}`; };

  // each entry: [Parameter label, getterFn]
  const laserRows=[
    ['Wavelength', s=>fmt(s.laser?.wavelength,s.laser?.wavelength_u)],
    ['Average power', s=>fmt(s.laser?.power,s.laser?.power_u)],
    ['Pulse energy', s=>fmt(s.laser?.energy,s.laser?.energy_u)],
    ['Frequency / rep. rate', s=>fmt(s.laser?.frequency,s.laser?.frequency_u)],
    ['Pulse duration', s=>fmt(s.laser?.pulse,s.laser?.pulse_u)],
    ['Scan speed', s=>fmt(s.laser?.speed,s.laser?.speed_u)],
    ['Spot size', s=>fmt(s.laser?.spot,s.laser?.spot_u)],
    ['Hatch spacing', s=>fmt(s.laser?.hatch,s.laser?.hatch_u)],
    ['Passes / repetitions', s=>fmt(s.laser?.passes)],
    ['Source / model', s=>fmt(s.laser?.source)],
    ['Notes', s=>fmt(s.laser?.notes)],
    ['— LINES —', s=>s.laser?.lines?'yes':''],
    ['Lines: wavelength', s=>fmt(s.laser?.lines?.wavelength,s.laser?.lines?.wavelength_u)],
    ['Lines: average power', s=>fmt(s.laser?.lines?.power,s.laser?.lines?.power_u)],
    ['Lines: pulse energy', s=>fmt(s.laser?.lines?.energy,s.laser?.lines?.energy_u)],
    ['Lines: frequency', s=>fmt(s.laser?.lines?.frequency,s.laser?.lines?.frequency_u)],
    ['Lines: pulse duration', s=>fmt(s.laser?.lines?.pulse,s.laser?.lines?.pulse_u)],
    ['Lines: scan speed', s=>fmt(s.laser?.lines?.speed,s.laser?.lines?.speed_u)],
    ['Lines: spot size', s=>fmt(s.laser?.lines?.spot,s.laser?.lines?.spot_u)],
    ['Lines: line spacing', s=>fmt(s.laser?.lines?.spacing,s.laser?.lines?.spacing_u)],
    ['Lines: passes', s=>fmt(s.laser?.lines?.passes)],
    ['Lines: source / model', s=>fmt(s.laser?.lines?.source)],
    ['Lines: notes', s=>fmt(s.laser?.lines?.notes)],
  ];

  const BANNER='GENERATED BY LABCORE — DO NOT EDIT. This file is rewritten automatically '+
               'every time a sample or recipe is saved, so any changes made here will be lost. '+
               'Enter data in LabCore instead.';
  const buildSheet=(rows)=>{
    const header=['Parameter',...(samples.length?samples.map(s=>sampleFullName(s)):['(no samples)'])];
    const groupRow=['Group',...(samples.length?samples.map(s=>sampleGroup(s)):[''])];
    const aoa=[[BANNER],[],header,groupRow];
    rows.forEach(([label,get])=>{
      aoa.push([label,...(samples.length?samples.map(s=>get(s)):[''])]);
    });
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols']=header.map((_,i)=>({wch:i===0?24:18}));
    return ws;
  };

  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,buildSheet(laserRows),'Laser');

  // Recipes sheet — mirrors the thermal printer's own layout
  const withRec=samples.filter(sm=>sm.recipe&&Array.isArray(sm.recipe.rows)&&sm.recipe.rows.length);
  {
    const unitShort=u=>({min:'m.',s:'s.',h:'h.'}[u]||u||'');
    const aoa=[[BANNER],[],['Sample','Printed at','Recipe date','#','Step','Time','US','Temp','Notes']];
    if(!withRec.length)aoa.push(['(no chemical recipes recorded yet)','','','','','','','','']);
    withRec.forEach(sm=>{
      const r=sm.recipe;
      aoa.push([sampleFullName(sm),r.printedAt||'',r.recipeDateTime||'','','','','','','']);
      (r.rows||[]).forEach((row,i)=>aoa.push(['','','',row.index||i+1,row.step||'',
        row.time?String(row.time)+(row.unit?' '+unitShort(row.unit):''):'',
        row.us?'US':'',row.temp||'',row.notes||'']));
      if(r.footer)aoa.push(['','','','','Notes: '+r.footer,'','','','']);
      aoa.push(['','','','','','','','','']);
    });
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols']=[{wch:16},{wch:20},{wch:16},{wch:4},{wch:26},{wch:10},{wch:5},{wch:9},{wch:26}];
    XLSX.utils.book_append_sheet(wb,ws,'Recipes');
  }
  const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  const blob=new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const name=EXPORT_NAME;
  let existing=p.data.excelId||await findFile(name,p.folderId);
  if(!existing){
    // carry over the old parameters.xlsx (keeps its Drive history and link)
    const legacy=await findFile('parameters.xlsx',p.folderId);
    if(legacy){ try{ await renameDriveFile(legacy,name); existing=legacy; }catch(e){} }
  }
  const r=await uploadBlob(name,p.folderId,blob,blob.type,existing);
  p.data.excelId=r.id; p.data.excelLink=r.webViewLink;
}

/* ---------- Projects ---------- */
async function loadProjects(){
  projects=[];
  let folders=[],pageToken=null,skipped=0;
  // page through every project folder
  do{
    const r=await gapi.client.drive.files.list({
      q:`'${rootFolderId}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`,
      fields:'nextPageToken, files(id,name)',orderBy:'createdTime desc',pageSize:1000,
      pageToken:pageToken||undefined});
    folders=folders.concat(r.result.files||[]);
    pageToken=r.result.nextPageToken;
  }while(pageToken);

  const note=document.getElementById('loadState');
  if(note)note.innerHTML=`<span class="loader"></span> Loading ${folders.length} project folder(s)…`;

  // load one project folder -> project object (or null)
  async function loadOne(folder){
    try{
      const jr=await gapi.client.drive.files.list({
        q:`'${folder.id}' in parents and name='project.json' and trashed=false`,
        fields:'files(id,modifiedTime)',pageSize:100});
      if(!jr.result.files.length)return null;      // not a project folder
      // several copies can exist from an earlier bug: read the newest, trash the rest
      let files=jr.result.files.slice()
        .sort((a,b)=>new Date(b.modifiedTime)-new Date(a.modifiedTime));
      if(files.length>1){
        for(const f of files.slice(1)){
          try{ await gapi.client.drive.files.update({fileId:f.id,resource:{trashed:true}}); }
          catch(e){}
        }
        console.log(`[LABCORE] cleaned ${files.length-1} duplicate project.json in ${folder.name}`);
      }
      const jsonId=files[0].id;
      let data=await readJson(jsonId);
      if(typeof data==='string')data=JSON.parse(data);
      if(!data||typeof data!=='object')throw new Error('unreadable project.json');
      data=normalizeProjectData(data,folder.name);
      return {jsonId,folderId:folder.id,data,
              mtime:files[0].modifiedTime,
              base:JSON.parse(JSON.stringify(data))};   // snapshot for 3-way merge
    }catch(e){
      skipped++; console.warn('[LABCORE] could not load',folder.name,e);
      return null;
    }
  }

  // fetch in parallel batches (much faster than one-by-one) and show progress
  const BATCH=8;
  for(let i=0;i<folders.length;i+=BATCH){
    const chunk=folders.slice(i,i+BATCH);
    const results=await Promise.all(chunk.map(loadOne));
    results.forEach(r=>{ if(r)projects.push(r); });
    const n2=document.getElementById('loadState');
    if(n2)n2.innerHTML=`<span class="loader"></span> Loaded ${projects.length} project(s)…`;
  }

  peopleColorMap=null;   // rebuild colour assignments for the new roster
  console.log(`[LABCORE] root=${rootFolderId} folders=${folders.length} projects=${projects.length} skipped=${skipped}`);
  if(skipped)toast(skipped+' project(s) could not be read — see console',true);
}

/* fill in defaults so projects written by older versions still work */
function normalizeProjectData(data,folderName){
  data.name=data.name||(folderName||'').replace(/^PRJ_/,'').replace(/_/g,' ');
  data.status=data.status||'active';
  data.priority=data.priority||'Medium';
  data.deadline=data.deadline||'';
  data.description=data.description||'';
  data.samples=Array.isArray(data.samples)?data.samples:[];
  data.drawings=Array.isArray(data.drawings)?data.drawings:[];
  data.people=Array.isArray(data.people)?data.people:[];
  data.tasks=Array.isArray(data.tasks)?data.tasks.map(t=>{
    if(typeof t==='string')return {text:t,done:false};
    if(t.who&&!data.people.some(x=>x.toLowerCase()===t.who.toLowerCase()))data.people.push(t.who);
    return {text:t.text||'',done:!!t.done};
  }):[];
  return data;
}

/* ================= CONCURRENT EDITING =================
   Several people can have the same project open. Before writing we check
   whether the file changed on Drive since we loaded it; if it did we do a
   three-way merge (common ancestor = the copy we started from) so both
   sets of changes survive instead of one overwriting the other.        */
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
const pick=(base,ours,theirs)=>same(ours,base)?theirs:ours;   // we changed it? keep ours

/* merge a list of plain strings (people) */
function mergeStrings(base,ours,theirs,keyOf){
  const k=x=>keyOf?keyOf(x):x;
  const removedByUs=base.filter(b=>!ours.some(o=>k(o)===k(b))).map(k);
  const addedByUs  =ours.filter(o=>!base.some(b=>k(b)===k(o)));
  const out=theirs.filter(t=>!removedByUs.includes(k(t)));
  addedByUs.forEach(a=>{ if(!out.some(o=>k(o)===k(a)))out.push(a); });
  return out;
}
/* merge a list of objects identified by a key, merging items present in both */
function mergeObjects(base,ours,theirs,keyOf,mergeItem){
  const find=(arr,key)=>arr.find(x=>keyOf(x)===key);
  const removedByUs=base.filter(b=>!find(ours,keyOf(b))).map(keyOf);
  const out=[];
  theirs.forEach(t=>{
    const key=keyOf(t);
    if(removedByUs.includes(key))return;                 // we deleted it
    const o=find(ours,key), b=find(base,key);
    out.push(o&&b ? mergeItem(b,o,t) : (o||t));
  });
  ours.forEach(o=>{ if(!find(theirs,keyOf(o))&&!find(base,keyOf(o)))out.push(o); });  // we added it
  return out;
}
const unionById=(a,b)=>{
  const out=[...(a||[])];
  (b||[]).forEach(x=>{ if(!out.some(y=>y.id===x.id))out.push(x); });
  return out;
};
function mergeMilestone(b,o,t){
  return {...t,...o,
    done:pick(b.done,o.done,t.done), doneAt:pick(b.doneAt,o.doneAt,t.doneAt),
    folderId:o.folderId||t.folderId, files:unionById(t.files,o.files)};
}
function mergeTask(b,o,t){
  return {text:o.text||t.text, done:pick(b.done,o.done,t.done)};
}
function mergeSample(b,o,t){
  return {
    label:pick(b.label,o.label,t.label),
    material:pick(b.material,o.material,t.material),
    group:pick(b.group,o.group,t.group),
    created:o.created||t.created,
    folderId:o.folderId||t.folderId,
    laser:pick(b.laser,o.laser,t.laser),
    recipe:pick(b.recipe,o.recipe,t.recipe),
    chem:pick(b.chem,o.chem,t.chem),
    files:unionById(t.files,o.files)
  };
}
function mergeProject(base,ours,theirs){
  const out=JSON.parse(JSON.stringify(theirs));
  ['name','status','priority','deadline','description','start'].forEach(k=>{
    out[k]=pick(base[k],ours[k],theirs[k]);
  });
  out.milestones=mergeObjects(base.milestones||[],ours.milestones||[],theirs.milestones||[],
                           m=>String(m.date||'')+'|'+String(m.text||'').toLowerCase(),mergeMilestone);
  out.people =mergeStrings(base.people||[],ours.people||[],theirs.people||[],x=>String(x).toLowerCase());
  out.tasks  =mergeObjects(base.tasks||[],ours.tasks||[],theirs.tasks||[],
                           t=>String(t.text||'').toLowerCase(),mergeTask);
  out.samples=mergeObjects(base.samples||[],ours.samples||[],theirs.samples||[],
                           s=>sampleKey(s),mergeSample);
  out.drawings=unionById(theirs.drawings,ours.drawings);
  out.excelId  =theirs.excelId||ours.excelId;
  out.excelLink=theirs.excelLink||ours.excelLink;
  return out;
}

/* escape text for safe HTML insertion */
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------- Deadline helpers (date only, no time) ---------- */
/* days remaining: negative = overdue, 0 = today */
function daysUntil(dateStr){
  if(!dateStr)return null;
  const today=new Date(); today.setHours(0,0,0,0);
  const d=new Date(dateStr+'T00:00:00');
  if(isNaN(d))return null;
  return Math.round((d-today)/86400000);
}
/* colour class + label based on how close the deadline is */
function deadlineInfo(dateStr){
  const n=daysUntil(dateStr);
  if(n===null)return {cls:'dl-none',label:'No deadline',days:null};
  const nice=new Date(dateStr+'T00:00:00').toLocaleDateString(undefined,
    {year:'numeric',month:'short',day:'numeric'});
  let cls,label;
  if(n<0){cls='dl-over';label=`${nice} · ${Math.abs(n)}d overdue`;}
  else if(n===0){cls='dl-today';label=`${nice} · today`;}
  else if(n===1){cls='dl-today';label=`${nice} · tomorrow`;}
  else if(n<=7){cls='dl-near';label=`${nice} · ${n}d left`;}
  else if(n<=30){cls='dl-soon';label=`${nice} · ${n}d left`;}
  else{cls='dl-far';label=`${nice} · ${n}d left`;}
  return {cls,label,days:n};
}

/* ---------- DIAGNOSTIC: find every project anywhere in Drive ----------
   Searches the whole Drive for project.json files, works out which top-level
   folder each one sits under, and lets you switch the app to that folder. */
async function scanDrive(){
  if(PINNED_ROOT_ID){
    document.getElementById('mainView').innerHTML=`
      <div class="tilebar"><h2>Drive folder</h2></div>
      <div class="panelbox">
        <p style="line-height:1.7">LabCore is <b>pinned</b> to the lab folder and cannot be switched from here.</p>
        <div class="row"><span class="k">Folder</span><span class="v"><code>${esc(rootFolderId)}</code></span></div>
        <div class="row"><span class="k">Owner</span><span class="v">${esc(rootOwner||'—')}</span></div>
        <div class="row"><span class="k">You are signed in as</span><span class="v">${esc(signedInEmail||'—')}</span></div>
        <button class="btn btn-out" style="margin-top:14px"
          onclick="window.open('https://drive.google.com/drive/folders/${esc(rootFolderId)}','_blank')">📁 Open in Drive</button>
      </div>`;
    return;
  }
  document.getElementById('mainView').innerHTML=
    `<div class="tilebar"><h2>Find my projects</h2></div>
     <div class="panelbox"><span class="loader"></span> Scanning your Drive…</div>`;
  try{
    // 1. every project.json we can see
    let files=[],pageToken=null;
    do{
      const r=await gapi.client.drive.files.list({
        q:"name='project.json' and trashed=false",
        fields:'nextPageToken, files(id,name,parents,owners(emailAddress))',
        pageSize:1000,pageToken:pageToken||undefined});
      files=files.concat(r.result.files||[]);
      pageToken=r.result.nextPageToken;
    }while(pageToken);

    if(!files.length){
      document.getElementById('mainView').innerHTML=
        `<div class="tilebar"><h2>Find my projects</h2></div>
         <div class="panelbox">No <code>project.json</code> files were found anywhere in this account's Drive.
         <br><br>That means this Google account cannot see the project data. Most likely the projects
         live in another account's Drive and the <code>LABCORE_DATA</code> folder has not been shared
         with this account (Share → add this account as <b>Editor</b>).</div>`;
      return;
    }

    // 2. resolve each project folder + its parent (the LABCORE_DATA root)
    const cache={};
    async function meta(id){
      if(cache[id])return cache[id];
      const r=await gapi.client.drive.files.get({fileId:id,
        fields:'id,name,parents,ownedByMe,owners(emailAddress)'});
      cache[id]=r.result; return r.result;
    }
    const groups={};   // rootId -> {name, owner, ownedByMe, count}
    for(const f of files){
      try{
        const projFolder=await meta((f.parents||[])[0]);
        const rootId=(projFolder.parents||[])[0];
        const root=rootId?await meta(rootId):{id:'?',name:'(no parent)'};
        if(!groups[root.id])groups[root.id]={
          id:root.id,name:root.name,count:0,
          ownedByMe:root.ownedByMe,
          owner:(root.owners&&root.owners[0]?root.owners[0].emailAddress:'—')};
        groups[root.id].count++;
      }catch(e){ console.warn('scan: could not resolve',f.id,e); }
    }

    const list=Object.values(groups).sort((a,b)=>b.count-a.count);
    document.getElementById('mainView').innerHTML=`
      <div class="tilebar"><h2>Find my projects</h2></div>
      <div class="panelbox">
        <p style="margin-bottom:14px;color:var(--mute);line-height:1.6">
          Found <b>${files.length}</b> project file(s) across <b>${list.length}</b> folder(s).
          The app is currently using folder <code>${rootFolderId}</code>.
          Click a folder below to load its projects.</p>
        <div id="scanList"></div>
      </div>`;
    const holder=document.getElementById('scanList');
    list.forEach(g=>{
      const cur=g.id===rootFolderId;
      const row=document.createElement('div');
      row.className='taskrow';
      row.style.marginBottom='8px';
      row.innerHTML=`<span style="line-height:1.5">
          <b>${esc(g.name)}</b> ${cur?'<span class="prio prio-medium prio-mini">IN USE</span>':''}<br>
          <span style="font-size:12px;color:var(--mute)">${g.count} project(s) · owner: ${esc(g.owner)} · <code>${g.id}</code></span>
        </span>
        <button class="btn ${cur?'btn-out':'btn-acc'}" style="padding:8px 14px;font-size:12px">${cur?'Reload':'Use this'}</button>`;
      row.querySelector('button').onclick=async()=>{
        if(PINNED_ROOT_ID&&g.id!==PINNED_ROOT_ID){
          toast('LabCore is pinned to the lab folder — switching is disabled',true);return;}
        rootFolderId=g.id;
        try{localStorage.setItem('labcore_root',g.id);}catch(e){}
        toast('Loading projects from '+g.name);
        await loadProjects();
        renderHome();
      };
      holder.appendChild(row);
    });
  }catch(e){
    document.getElementById('mainView').innerHTML=
      `<div class="panelbox">Scan failed: ${esc(e.message||String(e))}</div>`;
  }
}

/* ================= THERMAL PRINTER ENGINE =================
   Ported from the standalone printer page. Talks to the Arduino at
   http://<IP>/print and /status. Because browsers block http:// calls
   from an https:// page, printing only works when LabCore is opened
   over http (i.e. run locally on the lab computer). Everywhere else
   the app is view/edit-only, which is exactly the intended split.     */
const CW=32;                                  // ESC/POS chars per line
const LT_MAP={'ą':'a','č':'c','ę':'e','ė':'e','į':'i','š':'s','ų':'u','ū':'u','ž':'z',
              'Ą':'A','Č':'C','Ę':'E','Ė':'E','Į':'I','Š':'S','Ų':'U','Ū':'U','Ž':'Z'};
const ltAsc=s=>String(s).replace(/[ąčęėįšųūžĄČĘĖĮŠŲŪŽ]/g,c=>LT_MAP[c]||c);
function txtWrap(s,W){
  const out=[];
  String(s).split('\n').forEach(para=>{
    if(!para){out.push('');return;}
    let p=para;
    while(p.length>0){
      if(p.length<=W){out.push(p);break;}
      let cut=p.lastIndexOf(' ',W); if(cut<=0)cut=W;
      out.push(p.substring(0,cut)); p=p.substring(cut).trimStart();
    }
  });
  return out;
}
let printerIP=localStorage.getItem('labcore_pip')||'';
let printerOnline=false;

/* printing is only possible when the page itself is not https */
function canPrint(){ return location.protocol!=='https:'; }
function printBlockedMsg(){
  return 'Printing is only available on the lab computer. This page is served over '+
         'HTTPS, and browsers block HTTPS pages from reaching the printer\'s http:// address. '+
         'Open LabCore locally on the lab PC (http://localhost:8000) to print.';
}
async function printerPost(path,payload){
  if(!canPrint())throw new Error(printBlockedMsg());
  if(!printerIP)throw new Error('No printer IP set — open Printer in the sidebar.');
  const r=await fetch(`http://${printerIP}${path}`,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload),signal:AbortSignal.timeout(20000)});
  const d=await r.json();
  if(!d.ok)throw new Error('Printer rejected the job');
  return true;
}
async function printerCheck(ip){
  const r=await fetch(`http://${ip||printerIP}/status`,{signal:AbortSignal.timeout(5000)});
  const d=await r.json();
  return !!d.ok;
}
/* centre a logo bitmap on the 384-dot paper (byte-level, keeps density) */
function centerLogoOnPaper(seg){
  if(!seg||seg.width===PW)return seg;
  const srcW=Math.min(seg.width,PW), srcBpr=Math.ceil(seg.width/8);
  const out=new Uint8Array(seg.height*BPR);
  const x0=Math.max(0,Math.floor((PW-srcW)/2));
  for(let y=0;y<seg.height;y++)for(let x=0;x<srcW;x++){
    const bit=(seg.packed[y*srcBpr+Math.floor(x/8)]>>(7-(x%8)))&1;
    if(bit){const ox=x0+x; out[y*BPR+Math.floor(ox/8)]|=(0x80>>(ox%8));}
  }
  return {...seg,packed:out,width:PW};
}
/* send segments; text via /print, logos via /bitmap, feed only on the last */
async function sendSegs(segs){
  for(let i=0;i<segs.length;i++){
    const seg=segs[i], feed=(i===segs.length-1);
    if(seg.type==='logo'){
      const o=centerLogoOnPaper(seg);
      await printerPost('/bitmap',{width:o.width,height:o.height,
        data:u8ToB64(o.packed),align:'left',feed});
    }else{
      await printerPost('/print',{type:'textlines',lines:seg.lines,opts:seg.opts,feed});
    }
  }
  return true;
}

/* ---- text metrics, matching the standalone printer page ---- */
function sizeScale(sz){ return ({24:1,25:2})[Number(sz)] || 1; }
function charsForScale(scale){ return Math.max(8, Math.floor(CW/Math.max(1,scale))); }
function cpad(str,W){ const pad=Math.max(0,Math.floor((W-str.length)/2)); return ' '.repeat(pad)+str; }

/* ---- logo bitmap helpers ---- */
function unpackLogoToCanvas(l){
  const bpr=Math.ceil(l.w/8);
  const c=document.createElement('canvas'); c.width=l.w; c.height=l.h;
  const ctx=c.getContext('2d');
  const id=ctx.createImageData(l.w,l.h);
  for(let y=0;y<l.h;y++)for(let x=0;x<l.w;x++){
    const bit=(l.packed[y*bpr+(x>>3)]>>(7-(x&7)))&1;
    const i=(y*l.w+x)*4, v=bit?0:255;
    id.data[i]=id.data[i+1]=id.data[i+2]=v; id.data[i+3]=255;
  }
  ctx.putImageData(id,0,0); return c;
}
function logoBounds(l){
  const bpr=Math.ceil(l.w/8);
  let x0=l.w,y0=l.h,x1=-1,y1=-1;
  for(let y=0;y<l.h;y++)for(let x=0;x<l.w;x++){
    if((l.packed[y*bpr+(x>>3)]>>(7-(x&7)))&1){
      if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;
    }
  }
  if(x1<0)return {x:0,y:0,w:l.w,h:l.h,empty:true};
  return {x:x0,y:y0,w:x1-x0+1,h:y1-y0+1,empty:false};
}
/* scale a stored logo to a percentage, exactly as the printer page did */
function makeScaledLogo(l,scale){
  const pct=Math.max(10,Math.min(200,parseInt(scale,10)||100));
  const src=unpackLogoToCanvas(l), b=logoBounds(l);
  let dw=Math.max(1,Math.round(b.w*pct/100));
  let dh=Math.max(1,Math.round(b.h*pct/100));
  if(dw>PW){ const fit=PW/dw; dw=PW; dh=Math.max(1,Math.round(dh*fit)); }
  const outBpr=Math.ceil(dw/8);
  const c=document.createElement('canvas'); c.width=dw; c.height=dh;
  const ctx=c.getContext('2d');
  ctx.imageSmoothingEnabled=false;
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,dw,dh);
  if(!b.empty)ctx.drawImage(src,b.x,b.y,b.w,b.h,0,0,dw,dh);
  const id=ctx.getImageData(0,0,dw,dh);
  const packed=new Uint8Array(dh*outBpr);
  for(let py=0;py<dh;py++)for(let px=0;px<dw;px++){
    const i=(py*dw+px)*4;
    const lum=0.299*id.data[i]+0.587*id.data[i+1]+0.114*id.data[i+2];
    if(lum<220)packed[py*outBpr+(px>>3)]|=(0x80>>(px%8));   // keeps scaled art dark
  }
  return {type:'logo',packed,width:dw,height:dh};
}
/* render text to a bitmap — used for inverted (white-on-black) titles */
function renderTextBitmap(lines,sz){
  const SUP=2, lh=Math.round(sz*1.30)+2, H=lines.length*lh+4;
  const c=document.createElement('canvas'); c.width=PW*SUP; c.height=H*SUP;
  const ctx=c.getContext('2d'); ctx.scale(SUP,SUP);
  ctx.fillStyle='#000'; ctx.fillRect(0,0,PW,H);
  ctx.fillStyle='#fff';
  ctx.font=`bold ${sz}px "DejaVu Sans Mono", monospace`;
  ctx.textBaseline='middle'; ctx.textAlign='center';
  lines.forEach((t,i)=>ctx.fillText(t,PW/2,2+i*lh+lh/2));
  const small=document.createElement('canvas'); small.width=PW; small.height=H;
  small.getContext('2d').drawImage(c,0,0,PW,H);
  const id=small.getContext('2d').getImageData(0,0,PW,H);
  const bpr=Math.ceil(PW/8), packed=new Uint8Array(H*bpr);
  for(let y=0;y<H;y++)for(let x=0;x<PW;x++){
    const i=(y*PW+x)*4;
    const lum=0.299*id.data[i]+0.587*id.data[i+1]+0.114*id.data[i+2];
    if(lum<128)packed[y*bpr+(x>>3)]|=(0x80>>(x%8));
  }
  return {type:'logo',packed,width:PW,height:H};
}

/* ---- MESSAGE: the same layout the standalone page produced ---- */
function buildMessageSegs(p){
  const segs=[];
  const bodyScale=sizeScale(p.sz||24), titleScale=sizeScale(p.titleSz||p.sz||24);
  const W=charsForScale(bodyScale), DASH='-'.repeat(CW);
  const clean=v=>ltAsc(String(v||''));

  if(p.logoKey){
    const lg=findLogo(p.logoKey);
    if(lg&&lg.packed)segs.push(makeScaledLogo(lg,p.logoScale||100));
  }
  // date + rule in one segment, so the printer keeps them together
  segs.push({lines:[cpad(clean(p.date||nowStamp()),CW),'',DASH],
             opts:{bold:false,center:false,size:1}});

  if(p.title){
    const wrapped=txtWrap(clean(p.title),charsForScale(titleScale));
    if(p.inv){
      segs.push(renderTextBitmap(wrapped,24*titleScale));
      segs.push({lines:['',DASH],opts:{bold:false,center:false,size:1}});
    }else{
      segs.push({lines:wrapped,opts:{bold:true,center:!!p.centerTitle,size:titleScale}});
      segs.push({lines:[DASH],opts:{bold:false,center:false,size:1}});
    }
  }
  if(p.body){
    const lines=[];
    p.body.split('\n').forEach(para=>{
      if(!para){lines.push('');return;}
      txtWrap(clean(para),W).forEach(l=>lines.push(l));
    });
    segs.push({lines,opts:{bold:!!p.bold,center:!!p.centerBody,size:bodyScale}});
  }
  if(p.footer){
    segs.push({lines:[DASH],opts:{bold:false,center:false,size:1}});
    segs.push({lines:[cpad(clean(p.footer),CW)],opts:{bold:false,center:false,size:1}});
  }
  return segs;
}

/* ---- print job log ---- */
let printLog=[];
function logPrint(what,ok,err){
  printLog.unshift({t:new Date().toISOString(),what,ok,err:err||''});
  printLog=printLog.slice(0,60);
  const el=document.getElementById('prn_log'); if(el)renderPrintLog();
}
function renderPrintLog(){
  const el=document.getElementById('prn_log'); if(!el)return;
  if(!printLog.length){el.innerHTML='<div class="empty-note" style="padding:12px">Nothing printed yet in this session.</div>';return;}
  el.innerHTML=printLog.map(e=>`<div class="logrow">
      <span class="logdot ${e.ok?'ok':'bad'}"></span>
      <span class="logwhat">${esc(e.what)}</span>
      <span class="logtime">${new Date(e.t).toLocaleTimeString()}</span>
      ${e.err?`<div class="logerr">${esc(e.err)}</div>`:''}
    </div>`).join('');
}
/* every print goes through here so the log and errors are consistent */
async function runPrint(what,fn){
  try{ await fn(); logPrint(what,true); toast('Printed: '+what); return true; }
  catch(e){ logPrint(what,false,e.message||String(e)); toast('Print failed: '+(e.message||e),true); return false; }
}

/* Build the exact recipe printout the standalone page produced */
function buildRecipeSegs(rec,sampleLabel,big){
  const scale=big?2:1;
  const name=ltAsc(rec.sampleName||sampleLabel||'');
  const DASH='-'.repeat(CW);
  const unitShort=u=>({min:'m.',s:'s.',h:'h.'}[u]||u||'');

  const head=[ltAsc(String(rec.recipeDateTime||'')),'',DASH];
  const titleLines=txtWrap(name,CW);
  const body=[DASH,'Step             TIME   US  Temp',DASH];

  (rec.rows||[]).forEach((r,i)=>{
    const step=ltAsc((r.step||'-').trim());
    const tv=ltAsc(String(r.time||'').trim());
    const time=tv?(tv+' '+unitShort(r.unit)):'-';
    const us=r.us?'US':'';
    const temp=ltAsc(String(r.temp||'').trim());
    const prefix=String(i+1).padStart(2,' ')+'. ';
    txtWrap(step,13).forEach((chunk,ci)=>{
      if(ci===0){
        body.push((prefix+chunk).substring(0,17).padEnd(17)+
                  time.substring(0,7).padEnd(7)+
                  us.substring(0,4).padEnd(4)+
                  temp.substring(0,6));
      }else{
        body.push(('    '+chunk).substring(0,17).padEnd(17));
      }
    });
  });
  if(rec.footer){ body.push(DASH); txtWrap(ltAsc(rec.footer),CW).forEach(l=>body.push(l)); }

  const segs=[];
  const logo=findLogo(rec.logo);
  if(logo&&logo.packed)segs.push({type:'logo',packed:logo.packed,width:logo.w,height:logo.h});
  segs.push({lines:head,      opts:{bold:false,center:false,size:1}});
  segs.push({lines:titleLines,opts:{bold:true, center:true, size:scale}});
  segs.push({lines:body,      opts:{bold:false,center:false,size:scale}});
  return segs;
}
/* print a sample's recipe */
async function printSampleRecipe(p,si,big){
  const sm=p.data.samples[si];
  if(!sm.recipe||!(sm.recipe.rows||[]).length)throw new Error('No recipe to print');
  await sendSegs(buildRecipeSegs(sm.recipe,sampleFullName(sm),big));
  sm.recipe.printedAt=new Date().toISOString();
  await saveProject(p);
  try{ await recordPrintedRecipe(p,sm,sm.recipe); }
  catch(e){ console.warn('[LABCORE] printed-log write failed',e);
            toast('Printed, but the master log could not be updated',true); }
  return true;
}

/* ================= LOGOS (shared via Drive) ================= */
const PW=384, BPR=48;                      // paper width in dots / bytes per row
let labLogos=[]; let logosFileId=null;
function b64ToU8(b64){const bin=atob(b64);const u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
function u8ToB64(u8){let s='';for(let i=0;i<u8.length;i++)s+=String.fromCharCode(u8[i]);return btoa(s);}
async function loadLogos(){
  try{
    const id=await findFile('logos.json',rootFolderId);
    if(!id){labLogos=[];return;}
    logosFileId=id;
    let j=await readJson(id); if(typeof j==='string')j=JSON.parse(j);
    labLogos=(Array.isArray(j)?j:[]).map(l=>({...l,packed:b64ToU8(l.b64||'')}));
  }catch(e){ console.warn('[LABCORE] logos load',e); labLogos=[]; }
}
async function saveLogos(){
  const plain=labLogos.map(({key,name,w,h,prev,b64})=>({key,name,w,h,prev,b64}));
  logosFileId=await writeJson('logos.json',rootFolderId,plain,logosFileId);
}
/* turn an uploaded image into a 1-bit bitmap the printer understands */
function imageToLogo(file){
  return new Promise((resolve,reject)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{
      try{
        const sc=Math.min(PW/img.width,240/img.height,1);
        const dw=Math.round(img.width*sc), dh=Math.round(img.height*sc);
        const c=document.createElement('canvas'); c.width=PW; c.height=dh;
        const ctx=c.getContext('2d');
        ctx.fillStyle='#fff'; ctx.fillRect(0,0,PW,dh);
        ctx.drawImage(img,Math.round((PW-dw)/2),0,dw,dh);
        const id=ctx.getImageData(0,0,PW,dh);
        const packed=new Uint8Array(dh*BPR);
        for(let py=0;py<dh;py++)for(let px=0;px<PW;px++){
          const i=(py*PW+px)*4;
          const lum=0.299*id.data[i]+0.587*id.data[i+1]+0.114*id.data[i+2];
          if(lum<160)packed[py*BPR+Math.floor(px/8)]|=(0x80>>(px%8));
        }
        const pv=document.createElement('canvas');
        pv.width=96; pv.height=Math.max(1,Math.round(dh*96/PW));
        pv.getContext('2d').drawImage(c,0,0,pv.width,pv.height);
        URL.revokeObjectURL(url);
        resolve({key:'l'+Date.now(),name:file.name.replace(/\.[^.]+$/,''),
                 packed,b64:u8ToB64(packed),w:PW,h:dh,prev:pv.toDataURL()});
      }catch(err){reject(err);}
    };
    img.onerror=()=>reject(new Error('Could not read image'));
    img.src=url;
  });
}
function findLogo(nameOrKey){
  if(!nameOrKey)return null;
  return labLogos.find(l=>l.key===nameOrKey)||labLogos.find(l=>l.name===nameOrKey)||null;
}

/* ============== MASTER LOG OF EVERY PRINTED RECIPE ==============
   Kept as printed_recipes.json (source of truth) in LABCORE_DATA and
   mirrored to printed_recipes.xlsx after every print.                */
let printedLog=[]; let printedLogId=null; let printedXlsxId=null;
async function loadPrintedLog(){
  try{
    const id=await findFile('printed_recipes.json',rootFolderId);
    if(!id){printedLog=[];return;}
    printedLogId=id;
    let j=await readJson(id); if(typeof j==='string')j=JSON.parse(j);
    printedLog=Array.isArray(j)?j:(j.entries||[]);
  }catch(e){ console.warn('[LABCORE] printed log load',e); printedLog=[]; }
}
async function recordPrintedRecipe(p,sm,rec){
  printedLog.push({printedAt:rec.printedAt||new Date().toISOString(),
    project:p.data.name,sample:sampleFullName(sm),recipe:JSON.parse(JSON.stringify(rec))});
  printedLogId=await writeJson('printed_recipes.json',rootFolderId,printedLog,printedLogId);
  await writePrintedXlsx();
}
async function writePrintedXlsx(){
  const unitShort=u=>({min:'m.',s:'s.',h:'h.'}[u]||u||'');
  const aoa=[['Printed at','Project','Sample','Recipe date','#','Step','Time','US','Temp','Notes']];
  printedLog.slice().sort((a,b)=>new Date(b.printedAt)-new Date(a.printedAt)).forEach(e=>{
    const r=e.recipe||{};
    aoa.push([fmtStamp(e.printedAt),e.project||'',e.sample||'',r.recipeDateTime||'','','','','','','']);
    (r.rows||[]).forEach((row,i)=>aoa.push(['','','','',row.index||i+1,row.step||'',
      row.time?String(row.time)+(row.unit?' '+unitShort(row.unit):''):'',
      row.us?'US':'',row.temp||'',row.notes||'']));
    if(r.footer)aoa.push(['','','','','','Notes: '+r.footer,'','','','']);
    aoa.push(['','','','','','','','','','']);
  });
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[{wch:20},{wch:22},{wch:14},{wch:16},{wch:4},{wch:26},{wch:10},{wch:5},{wch:9},{wch:24}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Printed recipes');
  const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  const blob=new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const existing=printedXlsxId||await findFile('printed_recipes.xlsx',rootFolderId);
  const r=await uploadBlob('printed_recipes.xlsx',rootFolderId,blob,blob.type,existing);
  printedXlsxId=r.id;
  return r;
}
