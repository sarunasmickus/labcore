    if(e.key==='Enter'){e.preventDefault();document.getElementById('ns_save').click();} };
  document.getElementById('ns_save').onclick=async()=>{
    const label=document.getElementById('ns_label').value.trim();
    const err=document.getElementById('ns_err');
    if(!label){err.textContent='A sample label is required.';err.classList.add('show');return;}
    if(p.data.samples.some(x=>(x.label||'').toLowerCase()===label.toLowerCase())){
      err.textContent='A sample with that label already exists in this project.';
      err.classList.add('show');return;}
    const btn=document.getElementById('ns_save');btn.innerHTML='<span class="loader"></span> Adding…';
    try{
      const sm={label,material:document.getElementById('ns_material').value.trim(),
                laser:{},files:[],created:new Date().toISOString()};
      const files=staged('nsFiles');
      if(files.length){
        const folder=await ensureSubfolder('Sample_'+label.replace(/[^\w-]+/g,'_'),p.folderId);
        sm.folderId=folder;
        for(const f of files){
          const r=await uploadFile(f,folder);
          sm.files.push({id:r.id,name:r.name,type:inferType({mimeType:f.type,name:f.name}),
                         link:r.webViewLink,thumb:r.thumbnailLink});
        }
      }
      p.data.samples.push(sm);
      await saveProject(p); await writeParamsExcel(p);
      closeModal(); renderProject();
      toast('Sample '+label+' added');
    }catch(e){
      err.textContent='Could not add the sample: '+(e.message||e);
      err.classList.add('show'); btn.textContent='Add sample';
    }
  };
}

function openSampleForm(p,si){
  const editing=si!==undefined;
  const s=editing?p.data.samples[si]:{label:'',material:'',laser:{},chem:{},files:[]};
  document.getElementById('mainView').innerHTML=`
    <div class="crumb mono">PROJECT / <b>${esc(p.data.name).toUpperCase()}</b> / ${editing?'EDIT':'NEW'} SAMPLE</div>
    <div class="toolbar"><h2>${editing?'Edit':'Add'} Sample</h2>
      <button class="btn btn-out" id="cancelS">← Back to project</button></div>
    <div class="grid" style="max-width:860px">
      <div class="panelbox">
        <div class="two">
          <div class="field"><label>Sample label *</label><input id="s_label" value="${esc(s.label)}" placeholder="S-01"></div>
          <div class="field"><label>Material</label><input id="s_material" value="${esc(s.material||'')}" placeholder="Ti-6Al-4V"></div>
        </div>
      </div>
      <div>
        <div class="panelbox">
          <h3><span class="tag laser">LASER</span> Parameters</h3>
          ${prow('Wavelength','l_wavelength',s.laser?.wavelength,'l_wavelength_u',s.laser?.wavelength_u,['nm','µm'],'nm')}
          ${prow('Average power','l_power',s.laser?.power,'l_power_u',s.laser?.power_u,['mW','W'],'W')}
          ${prow('Pulse energy','l_energy',s.laser?.energy,'l_energy_u',s.laser?.energy_u,['nJ','µJ','mJ'],'µJ')}
          ${prow('Frequency / rep. rate','l_freq',s.laser?.frequency,'l_freq_u',s.laser?.frequency_u,['Hz','kHz','MHz'],'kHz')}
          ${prow('Pulse duration','l_pulse',s.laser?.pulse,'l_pulse_u',s.laser?.pulse_u,['fs','ps','ns','µs'],'ns')}
          ${prow('Scan speed','l_speed',s.laser?.speed,'l_speed_u',s.laser?.speed_u,['mm/s','m/s'],'mm/s')}
          ${prow('Spot size','l_spot',s.laser?.spot,'l_spot_u',s.laser?.spot_u,['µm','mm'],'µm')}
          ${prow('Hatch / line spacing','l_hatch',s.laser?.hatch,'l_hatch_u',s.laser?.hatch_u,['µm','mm'],'µm')}
          <div class="two">
            <div class="field"><label>Passes / repetitions</label><input id="l_passes" value="${esc(s.laser?.passes||'')}"></div>
            <div class="field"><label>Source / model</label><input id="l_source" value="${esc(s.laser?.source||'')}" placeholder="e.g. fiber, 1064 nm"></div>
          </div>
          <div class="field"><label>Notes</label><textarea id="l_notes" rows="2">${esc(s.laser?.notes||'')}</textarea></div>
        </div>
      </div>
      <button class="btn btn-acc" id="saveS" style="width:200px">${editing?'Save changes':'Add sample'}</button>
    </div>`;
  document.getElementById('cancelS').onclick=()=>renderProject();
  document.getElementById('saveS').onclick=async()=>{
    const label=document.getElementById('s_label').value.trim();
    if(!label){toast('Label required',true);return;}
    const obj={
      label,material:document.getElementById('s_material').value,
      laser:{
        wavelength:v('l_wavelength'),wavelength_u:v('l_wavelength_u'),
        power:v('l_power'),power_u:v('l_power_u'),
        energy:v('l_energy'),energy_u:v('l_energy_u'),
        frequency:v('l_freq'),frequency_u:v('l_freq_u'),
        pulse:v('l_pulse'),pulse_u:v('l_pulse_u'),
        speed:v('l_speed'),speed_u:v('l_speed_u'),
        spot:v('l_spot'),spot_u:v('l_spot_u'),
        hatch:v('l_hatch'),hatch_u:v('l_hatch_u'),
        passes:v('l_passes'),source:v('l_source'),notes:v('l_notes')},
      recipe:editing?s.recipe:undefined,          // chemical process = the recipe
      chem:editing?s.chem:undefined,               // legacy fields kept, never edited here
      folderId:editing?s.folderId:undefined,
      created:editing?(s.created||new Date().toISOString()):new Date().toISOString(),
      files:editing?(s.files||[]):[]
    };
    const btn=document.getElementById('saveS');btn.innerHTML='<span class="loader"></span>';
    try{
      if(editing)p.data.samples[si]=obj;else p.data.samples.push(obj);
      await writeParamsExcel(p);            // refresh the per-project .xlsx
      await saveProject(p);renderProject();toast('Sample saved · spreadsheet updated');
    }catch(e){toast('Error: '+e.message,true);btn.textContent='Save';}
  };
}
/* a parameter row: value input + unit dropdown */
function prow(label,valId,val,unitId,unitVal,units,defU){
  const sel=units.map(u=>`<option${ (unitVal||defU)===u?' selected':''}>${u}</option>`).join('');
  return `<div class="field"><label>${label}</label>
    <div class="valunit"><input id="${valId}" value="${esc(val||'')}">
    <select id="${unitId}">${sel}</select></div></div>`;
}
function v(id){const el=document.getElementById(id);return el?el.value:'';}
</script>
